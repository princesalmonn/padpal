<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PadPal Feed</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="PadPal">
<meta name="theme-color" content="#0B1426">
<link rel="stylesheet" href="styles.css?v=21">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=21"></script>
<script src="auth.js?v=21"></script>
<script src="doodles.js?v=21"></script>
<script src="levels.js?v=21"></script>
<script src="rate.js?v=21"></script>
<script src="sessions.js?v=21"></script>
<script src="share.js?v=21"></script>
<script>PadPal.me = PadPal.guard(); // members only</script>
<style>
  /* ===== Feed-only styles ===== */

  /* 🏷️ Tags */
  .tag-line { font-size: 13px; color: var(--text-2); margin: 10px 0 0; line-height: 26px; }
  .tag-line a { color: var(--text); font-weight: 700; text-decoration: none; }
  .tag-line .untag { float: right; border: 1px solid var(--line); background: var(--card-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--text-2); }
  .tag-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag-chips:empty { display: none; }
  .tag-chip { border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--text); border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 600; }
  .tag-list { max-height: 240px; overflow-y: auto; }
  .tag-row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 0; text-align: left; color: var(--text); }
  .tag-row .avatar { width: 34px; height: 34px; font-size: 14px; overflow: hidden; }
  .tag-row .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .tag-row span { flex: 1; min-width: 0; }
  .tag-row small { display: block; color: var(--text-2); font-size: 11px; }
  .tag-row i { font-style: normal; color: var(--accent); font-weight: 800; font-size: 18px; }
  article.flash { animation: postFlash 1.6s ease; }
  @keyframes postFlash { 0%, 50% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: none; } }

  /* 24h photo row (like Instagram Stories) */
  .stories { display: flex; gap: 14px; overflow-x: auto; padding: 6px 0 14px; scrollbar-width: none; }
  .stories::-webkit-scrollbar { display: none; }
  .story { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; flex-shrink: 0; }
  .ring { width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, var(--primary), var(--accent), var(--gold)); }
  .ring.seen { background: var(--line); }
  .ring .avatar { width: 100%; height: 100%; border: 3px solid var(--bg); font-size: 20px; overflow: hidden; }
  .story small { font-size: 11px; color: var(--text-2); max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .story .add { position: relative; }
  .story .add::after {
    content: "+"; position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; border-radius: 50%;
    background: var(--primary); color: var(--primary-text); border: 2px solid var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 15px; line-height: 1;
  }
  .avatar { overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

  /* Post */
  .post-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .post-head .user { min-width: 0; }
  .more { border: 0; background: none; color: var(--text-2); font-size: 18px; padding: 4px 8px; }
  .post-text { margin: 0 0 4px; line-height: 1.45; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .actions { display: flex; gap: 18px; margin-top: 12px; color: var(--text-2); font-size: 14px; flex-wrap: wrap; }
  .actions button { border: 0; background: none; padding: 4px 0; color: inherit; display: flex; align-items: center; gap: 5px; }
  .actions button.liked { color: var(--primary); font-weight: 700; }
  .actions .heart { display: inline-block; transition: transform .15s; }
  .actions .liked .heart { transform: scale(1.25); }

  /* "Play soon or lose points" banner */
  .idle-warn {
    display: block; text-decoration: none; margin: 4px 0 10px; padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 600;
    background: color-mix(in srgb, var(--loss) 14%, var(--card)); color: var(--text); border: 1px solid color-mix(in srgb, var(--loss) 40%, transparent);
  }

  /* Rank up / down announcement */
  .announce { text-align: center; padding: 18px 14px; }
  .announce.up { background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 22%, var(--card)), var(--card)); }
  .announce.down { background: linear-gradient(160deg, color-mix(in srgb, var(--loss) 18%, var(--card)), var(--card)); }
  .announce .big { font-size: 40px; }
  .announce .avatar { margin: 8px auto 0; width: 52px; height: 52px; font-size: 20px; }
  .announce h4 { margin: 8px 0 4px; font-size: 17px; }
  .announce p { margin: 0; color: var(--text-2); font-size: 13px; }
  .tier-change { display: inline-flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-weight: 700; font-size: 14px; }
  .announce .actions { justify-content: center; }

  /* Match result */
  .match { background: var(--card-2); border-radius: 12px; padding: 10px 12px; }
  .team { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 8px; }
  .team + .team { border-top: 1px solid var(--line); }
  .team .players { font-size: 14px; min-width: 0; }
  .team.win .players { font-weight: 700; }
  .sets { display: flex; gap: 12px; font-variant-numeric: tabular-nums; font-weight: 700; }
  .team:not(.win) .sets { color: var(--text-2); font-weight: 500; }
  .result { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; gap: 8px; flex-wrap: wrap; }

  /* Photo post */
  .photo { position: relative; border-radius: 12px; overflow: hidden; background: var(--card-2); margin-top: 8px; }
  .photo img { width: 100%; display: block; max-height: 70vh; object-fit: cover; }
  .timer {
    position: absolute; top: 10px; right: 10px; font-size: 12px; font-weight: 600;
    background: rgba(0,0,0,.55); color: #fff; padding: 4px 10px; border-radius: 999px;
  }
  .timer.pinned { background: var(--gold); color: #1C1F24; }

  .empty-feed { text-align: center; padding: 40px 16px; color: var(--text-2); }
  .empty-feed .big { font-size: 48px; }

  /* Story viewer (full screen) */
  .viewer {
    position: fixed; inset: 0; z-index: 50; background: #000; color: #fff;
    display: none; flex-direction: column; max-width: 440px; margin: 0 auto;
  }
  .viewer.open { display: flex; }
  .viewer .vhead { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 12px 12px; }
  .viewer .vhead .avatar { width: 34px; height: 34px; color: var(--text); }
  .viewer .close { margin-left: auto; border: 0; background: none; color: #fff; font-size: 30px; }
  .viewer .vphoto { flex: 1; display: grid; place-items: center; margin: 0 12px; min-height: 0; }
  .viewer .vphoto img { max-width: 100%; max-height: 100%; border-radius: 16px; }
  .viewer .vcap { padding: 10px 14px 0; font-size: 15px; white-space: pre-wrap; }
  .viewer .vfoot { padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }

  /* Comments + compose sheets */
  .comment { display: flex; gap: 10px; padding: 8px 0; font-size: 14px; }
  .comment .avatar { width: 32px; height: 32px; font-size: 13px; }
  .comment b { margin-right: 4px; }
  .comment .when { font-size: 11px; color: var(--text-2); }
  .comment-box { display: flex; gap: 8px; margin-top: 10px; }
  .comment-box input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card-2); color: var(--text);
    border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 16px; outline: none;
  }
  .comment-box input:focus { border-color: var(--accent); }
  textarea.input { resize: none; font-family: inherit; }
  .preview { width: 100%; max-height: 40vh; object-fit: cover; border-radius: 12px; margin-bottom: 12px; display: block; }

  /* "New" menu */
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu button { border: 1px solid var(--line); background: var(--card-2); border-radius: 14px; padding: 16px 10px; text-align: left; }
  .menu span { font-size: 26px; display: block; margin-bottom: 6px; }
  .menu small { color: var(--text-2); display: block; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><img class="logo-img logo-for-dark" src="logo-dark.svg" alt=""><img class="logo-img logo-for-light" src="logo-light.svg" alt=""><span>Pad</span><b>Pal</b></div>  </div>
</header>

<main class="wrap">
  <a class="idle-warn" id="idleWarn" href="play.html" hidden></a>
  <div class="stories" id="stories"></div>
  <div class="chips-row" id="feedChips">
    <button class="on" data-ffilter="all">🌍 All</button>
    <button data-ffilter="pals">👥 PadPals</button>
  </div>
  <div class="error-box" id="feedError" role="alert" hidden></div>
  <div id="feed"><div class="empty-feed">Loading…</div></div>
</main>

<!-- Bottom tab bar -->
<button class="fab" id="fab" aria-label="New post">+</button>
<nav class="tabbar">
  <div class="tabs">
    <a class="on" href="feed.html"><span>🏠</span>Feed</a>
    <a href="play.html"><span>🎾</span>Play</a>
    <a href="chat.html"><span>💬</span>Chat</a>
    <a href="ranks.html"><span>🏆</span>Ranks</a>
    <a href="profile.html"><span>👤</span>Me</a>
  </div>
</nav>

<input type="file" id="photoInput" accept="image/*" hidden>

<!-- Pop-ups -->
<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="newSheet">
  <div class="grab"></div>
  <h3>Create</h3>
  <div class="menu">
    <button data-new="photo"><span>📷</span>Photo<small>Gone in 24h unless pinned</small></button>
    <button data-new="text"><span>✏️</span>Text post<small>Stays forever</small></button>
    <button data-soon="Logging matches"><span>🎾</span>Log a match<small>Coming in Stage 2</small></button>
    <button data-soon="Open games"><span>📣</span>Open game<small>Coming soon</small></button>
  </div>
</div>

<div class="sheet" id="composeSheet">
  <div class="grab"></div>
  <h3 id="composeTitle">New post</h3>
  <form id="composeForm">
    <img class="preview" id="composePreview" alt="" hidden>
    <div class="field">
      <label for="composeText" id="composeLabel">What's up?</label>
      <textarea class="input" id="composeText" rows="3" maxlength="500"></textarea>
      <small><span id="composeCount">0</span> / 500</small>
    </div>
    <div class="field">
      <div class="tag-chips" id="tagChips"></div>
      <button type="button" class="btn btn-ghost" id="tagOpen" style="width:100%;padding:9px;font-size:14px">👥 Tag PadPals</button>
      <div id="tagPanel" hidden>
        <input class="input" id="tagSearch" placeholder="🔍 Search your PadPals" autocomplete="off" style="margin:8px 0">
        <div class="tag-list" id="tagList"></div>
      </div>
    </div>
    <p class="meta" id="composeNote" style="margin:0 0 12px" hidden>⏳ This photo disappears after 24 hours. You can pin it to your profile to keep it.</p>
    <button class="btn btn-primary" id="composeBtn" style="width:100%">Post</button>
  </form>
</div>

<div class="sheet" id="detailSheet"><div class="grab"></div><div id="detailBody"></div></div>

<div class="sheet" id="reportSheet">
  <div class="grab"></div>
  <h3>⚠️ Report wrong score</h3>
  <p class="meta" style="margin:-4px 0 12px">The admin will check it. If the score was wrong, the admin can undo the match and everyone's points go back.</p>
  <form id="reportForm">
    <div class="field">
      <label for="reportText">What was wrong?</label>
      <textarea class="input" id="reportText" rows="3" maxlength="200" required placeholder="We won 6-4 7-5, not them 😅"></textarea>
    </div>
    <button class="btn btn-primary" style="width:100%">Send report</button>
  </form>
</div>

<div class="sheet" id="commentsSheet">
  <div class="grab"></div>
  <h3>Comments</h3>
  <div id="commentList"></div>
  <form class="comment-box" id="commentForm">
    <input id="commentInput" placeholder="Add a comment…" autocomplete="off" maxlength="300">
    <button class="btn btn-primary" style="padding:10px 16px">Send</button>
  </form>
</div>

<div class="viewer" id="viewer">
  <div class="vhead">
    <div class="avatar" id="vAvatar"></div>
    <div><div class="name" id="vName"></div><div style="font-size:12px;opacity:.7" id="vAgo"></div></div>
    <button class="close" id="vClose" aria-label="Close">×</button>
  </div>
  <div class="vphoto"><img id="vImg" alt=""></div>
  <div class="vcap" id="vCap"></div>
  <div class="vfoot">
    <span id="vLeft"></span>
    <button class="btn btn-accent" id="vPin" style="padding:8px 14px;font-size:13px">📌 Pin to profile</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var db = PadPal.db;
  var profile = null;
  var posts = [];
  var urls = {};        // photo path → link we can show
  var myPins = {};      // paths I've pinned to my profile
  var seen = {};        // stories already opened
  var commentsFor = null;
  var compose = null;   // { kind, file }
  var tagsOf = {};      // post id → tagged member ids
  var viewing = null;
  var matches = {};     // match id → match (with points changes)
  var sessions = {};    // game id → finished Americano/Mexicano (with points changes)
  var tourneys = {};    // tournament id → tournament (with teams)
  var people = {};      // member id → profile

  // ===== Helpers =====
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }
  function ago(iso) {
    var mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    if (mins < 1440) return Math.round(mins / 60) + 'h ago';
    if (mins < 10080) return Math.round(mins / 1440) + 'd ago';
    return new Date(iso).toLocaleDateString();
  }
  function hoursLeft(iso) { return Math.max(1, Math.ceil((new Date(iso) - Date.now()) / 3600000)); }
  function nameOf(a) { return a ? (a.display_name || a.username) : 'Someone'; }
  function avatarHtml(a) {
    var url = a && a.avatar_url && urls[a.avatar_url];
    return url ? '<img src="' + url + '" alt="">' : esc(nameOf(a)[0].toUpperCase());
  }
  // "Are you sure?" without pop-ups: tap once to warn, again within 3s to do it
  var armed = {};
  function tapTwice(key, warning) {
    if (armed[key]) { armed[key] = false; return true; }
    armed[key] = true;
    toast(warning);
    setTimeout(function () { armed[key] = false; }, 3000);
    return false;
  }

  // ===== Load =====
  PadPal.me.then(async function (me) {
    if (!me) return;
    profile = me.profile;
    // warn from 4 days without playing: "play by Sunday or lose 1 point"
    PadPal.inactivity(profile).then(function (inact) {
      if (!inact || inact.idle < 4) return;
      $('idleWarn').textContent = '🧊 No game for ' + inact.idle + ' days. Play by ' + inact.deadline + ' or lose ' +
        PadPal.fmt(inact.amount) + ' point' + (inact.amount === 1 ? '' : 's') + '. Tap to find a game 🎾';
      $('idleWarn').hidden = false;
    });
    await cleanupMyExpired();
    load().then(jumpToPost);
  });

  // Refresh when you come back to the app
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && profile) load();
  });

  async function load() {
    var r = await db.from('posts')
      .select('id, kind, body, photo_path, match_id, game_id, tournament_id, expires_at, created_at, author_id, author:profiles!posts_author_id_fkey(id, username, display_name, avatar_url), likes(user_id), comments(count)')
      .order('created_at', { ascending: false })
      .limit(50);
    if (r.error) {
      $('feed').innerHTML = '';
      $('feedError').textContent = PadPal.friendlyError(r.error);
      $('feedError').hidden = false;
      return;
    }
    $('feedError').hidden = true;
    posts = r.data.filter(function (p) { return !p.expires_at || new Date(p.expires_at) > Date.now(); });

    // Match results: load the matches, the points and the players' names
    var matchIds = posts.filter(function (p) { return p.match_id; }).map(function (p) { return p.match_id; });
    var gameIds = posts.filter(function (p) { return p.kind === 'session'; }).map(function (p) { return p.game_id; });
    if (matchIds.length) {
      var mr = await db.from('matches').select('id, a1, a2, b1, b2, sets, winner, played_at').in('id', matchIds);
      var cr = await db.from('point_changes').select('match_id, user_id, change, points_after').in('match_id', matchIds);
      (mr.data || []).forEach(function (m) { matches[m.id] = m; m.changes = {}; });
      (cr.data || []).forEach(function (c) { if (matches[c.match_id]) matches[c.match_id].changes[c.user_id] = c; });
    }
    if (gameIds.length) {
      var gr = await db.from('games').select('id, kind, place, scheduled_at, session_state').in('id', gameIds);
      var gc = await db.from('point_changes').select('game_id, user_id, change, created_at').in('game_id', gameIds);
      (gr.data || []).forEach(function (g) { sessions[g.id] = g; g.changes = {}; });
      (gc.data || []).forEach(function (c) { var g = sessions[c.game_id]; if (g) { g.changes[c.user_id] = c; g.finished = c.created_at; } });
    }
    var tIds = posts.filter(function (p) { return p.kind === 'tournament'; }).map(function (p) { return p.tournament_id; });
    if (tIds.length) {
      var tr = await db.from('tournaments').select('id, name, kind, division, tournament_teams(id, p1, p2, place)').in('id', tIds);
      (tr.data || []).forEach(function (t) { tourneys[t.id] = t; });
    }
    if (!Object.keys(people).length) {   // names for results, tags and the tag picker
      try { (await PadPal.members()).forEach(function (m) { people[m.id] = m; }); } catch (err) {}
    }
    // 🏷️ who is tagged in which post (works even before 19_tags.sql: then simply no tags)
    tagsOf = {};
    if (posts.length) {
      var tg = await db.from('post_tags').select('post_id, user_id').in('post_id', posts.map(function (p) { return p.id; }));
      (tg.data || []).forEach(function (t) { (tagsOf[t.post_id] = tagsOf[t.post_id] || []).push(t.user_id); });
    }

    var pr = await db.from('pinned_photos').select('path').eq('user_id', profile.id);
    myPins = {};
    (pr.data || []).forEach(function (p) { myPins[p.path] = true; });

    var paths = [];
    if (profile.avatar_url) paths.push(profile.avatar_url);
    posts.forEach(function (p) {
      if (p.photo_path) paths.push(p.photo_path);
      if (p.author && p.author.avatar_url) paths.push(p.author.avatar_url);
    });
    paths = paths.filter(function (p, i) { return paths.indexOf(p) === i && !urls[p]; });
    try { Object.assign(urls, await PadPal.photoUrls(paths)); } catch (err) {}

    renderStories();
    renderFeed();
  }

  // Photo posts older than 24h: delete them (and their file, unless pinned)
  async function cleanupMyExpired() {
    try {
      var r = await db.from('posts').select('id, photo_path')
        .eq('author_id', profile.id).lt('expires_at', new Date().toISOString());
      if (!r.data || !r.data.length) return;
      var pr = await db.from('pinned_photos').select('path').eq('user_id', profile.id);
      var pinned = {};
      (pr.data || []).forEach(function (p) { pinned[p.path] = true; });
      var files = r.data.map(function (p) { return p.photo_path; }).filter(function (f) { return f && !pinned[f]; });
      if (files.length) await db.storage.from('photos').remove(files);
      await db.from('posts').delete().in('id', r.data.map(function (p) { return p.id; }));
    } catch (err) { /* try again next time */ }
  }

  // ===== 24h photo row =====
  function renderStories() {
    var mine = { avatar_url: profile.avatar_url, display_name: profile.display_name, username: profile.username };
    var html = '<button class="story" data-new="photo"><div class="ring seen add"><div class="avatar">' + avatarHtml(mine) + '</div></div><small>Your photo</small></button>';
    posts.forEach(function (p) {
      if (p.kind !== 'photo') return;
      html += '<button class="story" data-story="' + p.id + '">' +
        '<div class="ring' + (seen[p.id] ? ' seen' : '') + '"><div class="avatar" data-uid="' + p.author_id + '">' + avatarHtml(p.author) + '</div></div>' +
        '<small>' + esc(p.author ? p.author.username : '') + '</small></button>';
    });
    $('stories').innerHTML = html;
  }

  // ===== Posts =====
  // 🎉 / 😱 posted automatically when someone moves to another tier
  function tierByName(n) { return PadPal.TIERS.filter(function (t) { return t.name === n; })[0] || { icon: '', name: n }; }
  function rankPostHtml(p) {
    var a = p.author || {};
    var parts = (p.body || '').split('|');
    var from = tierByName(parts[0]), to = tierByName(parts[1]);
    var up = p.kind === 'rankup';
    var liked = p.likes.some(function (l) { return l.user_id === profile.id; });
    var nComments = p.comments && p.comments[0] ? p.comments[0].count : 0;
    var lines = up
      ? ['keep grinding 💪', 'the climb continues 🧗', 'who can stop this? 🔥']
      : ["didn't play enough? 🧊", 'time for revenge 😤', 'not having fun = you\'re out 😂'];
    var line = lines[p.id.charCodeAt(0) % lines.length];
    return '<article class="card announce ' + (up ? 'up' : 'down') + '">' +
      '<div class="big">' + (up ? '🎉' : '😱') + '</div>' +
      '<div class="avatar">' + avatarHtml(a) + '</div>' +
      '<h4>' + esc(nameOf(a)) + (up ? ' ranked up!' : ' dropped a tier!') + '</h4>' +
      '<div class="tier-change"><span class="pill">' + from.icon + ' ' + esc(from.name) + '</span>→<span class="pill">' + to.icon + ' ' + esc(to.name) + '</span></div>' +
      '<p>' + PadPal.fmt(parts[2]) + ' points · ' + line + ' · ' + ago(p.created_at) + '</p>' +
      '<div class="actions">' +
        '<button class="' + (liked ? 'liked' : '') + '" data-like="' + p.id + '"><span class="heart">' + (liked ? '❤️' : '🤍') + '</span>' + p.likes.length + '</button>' +
        '<button data-comments="' + p.id + '">💬 ' + nComments + '</button>' +
        (p.kind === 'rankup' ? '<button data-share="' + p.id + '">📤 Share</button>' : '') +
        (profile.is_admin ? '<button data-delete="' + p.id + '">🗑️</button>' : '') +
      '</div></article>';
  }

  // Opened from a 🔔 (feed.html#post-<id>): scroll to that post and highlight it
  function jumpToPost() {
    var m = /^#post-(.+)$/.exec(location.hash);
    if (!m) return;
    var el = document.getElementById('post-' + m[1]);
    if (!el) return toast('That post is gone (photos disappear after 24h)');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash');
    history.replaceState(null, '', 'feed.html');
  }

  // "👥 with Budi, Rina and Eko" (tap a name → profile) + "Remove me" if you're tagged
  function tagLine(p) {
    var ids = (tagsOf[p.id] || []).filter(function (id) { return people[id]; });
    if (!ids.length) return '';
    var links = ids.map(function (id) { return '<a href="' + profileLink(id) + '" data-uid="' + id + '">' + esc(fullName(id).split(' ')[0]) + '</a>'; });
    var text = links.length === 1 ? links[0] : links.slice(0, -1).join(', ') + ' and ' + links[links.length - 1];
    return '<div class="tag-line">👥 with ' + text +
      (ids.indexOf(profile.id) > -1 ? ' <button class="untag" data-untagme="' + p.id + '">Remove me</button>' : '') + '</div>';
  }

  function renderPost(p) {
    if (p.kind === 'rankup' || p.kind === 'rankdown') return rankPostHtml(p);
    var a = p.author || {};
    var mine = p.author_id === profile.id;
    var liked = p.likes.some(function (l) { return l.user_id === profile.id; });
    var nComments = p.comments && p.comments[0] ? p.comments[0].count : 0;
    var html = '<article class="card" id="post-' + p.id + '">' +
      '<div class="post-head"><a class="user" href="' + profileLink(p.author_id) + '" style="text-decoration:none;color:var(--text)"><div class="avatar" data-uid="' + p.author_id + '">' + avatarHtml(a) + '</div>' +
      '<div style="min-width:0"><div class="name" data-uid="' + p.author_id + '">' + esc(nameOf(a)) + '</div>' +
      '<div class="meta">@' + esc(a.username) + ' · ' + ago(p.created_at) + '</div></div></a>' +
      (mine || profile.is_admin ? '<button class="more" data-delete="' + p.id + '" aria-label="Delete post">🗑️</button>' : '') +
      '</div>';
    if (p.body) html += '<p class="post-text">' + esc(p.body) + '</p>';
    if (p.kind === 'match') html += matchHtml(matches[p.match_id]);
    if (p.kind === 'session') html += sessionHtml(sessions[p.game_id]);
    if (p.kind === 'tournament') html += tourneyHtml(tourneys[p.tournament_id], p.body);
    if (p.kind === 'photo') {
      var pinned = mine && myPins[p.photo_path];
      html += '<button class="photo" data-story="' + p.id + '" style="border:0;padding:0;width:100%;display:block">' +
        (urls[p.photo_path] ? '<img src="' + urls[p.photo_path] + '" alt="" loading="lazy">' : '<div style="padding:60px 0">📷</div>') +
        (pinned ? '<span class="timer pinned">📌 Pinned</span>' : '<span class="timer">⏳ ' + hoursLeft(p.expires_at) + 'h left</span>') +
        '</button>';
    }
    html += tagLine(p);
    html += '<div class="actions">' +
      '<button class="' + (liked ? 'liked' : '') + '" data-like="' + p.id + '"><span class="heart">' + (liked ? '❤️' : '🤍') + '</span>' + p.likes.length + '</button>' +
      '<button data-comments="' + p.id + '">💬 ' + nComments + '</button>' +
      '<button data-share="' + p.id + '">📤</button>' +
      (mine && p.kind === 'photo' && !myPins[p.photo_path] ? '<button data-pin="' + p.id + '">📌 Pin to profile</button>' : '') +
      (p.kind === 'match' && canReport(matches[p.match_id]) ? '<button data-rate="' + matchPlayers(matches[p.match_id]) + '">🎯 Rate shots</button>' : '') +
      (p.kind === 'session' && canReportSession(sessions[p.game_id]) ? '<button data-rate="' + Object.keys(sessions[p.game_id].changes).join(',') + '">🎯 Rate shots</button>' : '') +
      (p.kind === 'match' && canReport(matches[p.match_id]) ? '<button data-report="' + p.match_id + '">⚠️ Wrong score?</button>' : '') +
      (p.kind === 'session' && canReportSession(sessions[p.game_id]) ? '<button data-report-session="' + p.game_id + '">⚠️ Wrong score?</button>' : '') +
      '</div></article>';
    return html;
  }

  // Players of a match can report a wrong score within 24 hours
  function canReport(m) {
    if (!m) return false;
    var played = [m.a1, m.a2, m.b1, m.b2].indexOf(profile.id) > -1;
    return played && Date.now() - new Date(m.played_at) < 24 * 3600000;
  }
  function matchPlayers(m) { return [m.a1, m.a2, m.b1, m.b2].join(','); }
  function canReportSession(g) {
    return g && g.changes[profile.id] && Date.now() - new Date(g.finished) < 24 * 3600000;
  }
  var reportFor = null;
  var reportKind = 'match';
  function openReport(id, kind) {
    reportFor = id;
    reportKind = kind || 'match';
    $('reportText').value = '';
    closeSheets();
    openSheet($('reportSheet'));
  }

  // Match result card: winners on top, sets, everyone's points change
  function matchHtml(m) {
    if (!m) return '<p class="meta">Match result unavailable.</p>';
    function nm(id) { var p = people[id]; return esc(p ? (p.display_name || p.username) : '?'); }
    var teams = { a: [m.a1, m.a2], b: [m.b1, m.b2] };
    var win = m.winner, lose = win === 'a' ? 'b' : 'a';
    var idx = win === 'a' ? [0, 1] : [1, 0];
    function row(team, won) {
      return '<div class="team' + (won ? ' win' : '') + '"><div class="players">' + (won ? '🏆 ' : '') +
        nm(teams[team][0]) + ' & ' + nm(teams[team][1]) + '</div><div class="sets">' +
        m.sets.map(function (s) { return '<span>' + s[won ? idx[0] : idx[1]] + '</span>'; }).join('') + '</div></div>';
    }
    function changes(team) {
      return teams[team].map(function (id) {
        var c = m.changes[id];
        if (!c) return nm(id);
        return nm(id) + ' <span class="' + (c.change >= 0 ? 'plus' : 'minus') + '">' + PadPal.fmtChange(c.change) + '</span>';
      }).join(' · ');
    }
    return '<div class="match">' + row(win, true) + row(lose, false) + '</div>' +
      '<div class="result"><span>' + changes(win) + '</span><span>' + changes(lose) + '</span></div>';
  }

  // Tournament started / finished
  function tourneyHtml(t, what) {
    if (!t) return '<p class="meta">Tournament unavailable.</p>';
    function nm(id) { var p = people[id]; return esc(p ? (p.display_name || p.username) : '?'); }
    var title = (t.kind === 'official' ? '🏆 ' : '🎉 ') + esc(t.name);
    var html = '<a href="tourney.html?id=' + t.id + '" style="display:block;text-decoration:none;color:var(--text)"><div class="match">';
    if (what === 'finished') {
      [[1, '🥇'], [2, '🥈'], [3, '🥉']].forEach(function (r) {
        t.tournament_teams.filter(function (tm) { return tm.place === r[0]; }).forEach(function (tm) {
          html += '<div class="team' + (r[0] === 1 ? ' win' : '') + '"><div class="players">' + r[1] + ' ' + nm(tm.p1) + ' & ' + nm(tm.p2) + '</div></div>';
        });
      });
      html = '<p class="post-text" style="font-weight:600">' + title + ' · final results</p>' + html;
    } else {
      html = '<p class="post-text" style="font-weight:600">' + title + ' has started! 🚀</p>' + html +
        '<div class="team"><div class="players">' + t.tournament_teams.length + ' teams · tap to follow the groups and bracket</div></div>';
    }
    return html + '</div></a>';
  }

  // Session result: 🥇🥈🥉 podium, then everyone's place, games won/lost and points
  function personName(id) { var p = people[id]; return esc(p ? (p.display_name || p.username) : '?'); }
  function personAvatar(id) { return avatarHtml(people[id]); }
  function sessionHtml(g) {
    if (!g || !g.session_state || !g.session_state.players) return '<p class="meta">Session result unavailable.</p>';
    var s = g.session_state;
    var changes = {};
    Object.keys(g.changes).forEach(function (id) { changes[id] = g.changes[id].change; });
    var list = PadPal.sessions.rows(s, changes);
    var title = (PadPal.sessions.KINDS[g.kind] || '🔄 Session') + ' · ' + s.players.length + ' players · ' + s.rounds.length + ' rounds';
    return '<p class="post-text" style="font-weight:600">' + title + '</p>' +
      PadPal.sessions.podium(list, personName, personAvatar) +
      '<div class="match" style="padding:2px 12px">' + PadPal.sessions.table(list, personName, profile.id) + '</div>' +
      '<button class="btn btn-ghost" style="width:100%;margin-top:8px;padding:8px;font-size:13px" data-sdetail="' + g.id + '">📋 See all rounds</button>';
  }

  // 📤 Share any post as a story picture (full names, PadPal logo, "Exclusive Club")
  function fullName(id) { var p = people[id]; return p ? (p.display_name || p.username) : '?'; }
  async function sharePost(p) {
    if (!p) return;
    toast('📸 Making your picture…');
    var a = p.author || {};
    if (p.kind === 'match' && matches[p.match_id]) {
      var m = matches[p.match_id];
      return PadPal.share.match({ a: [fullName(m.a1), fullName(m.a2)], b: [fullName(m.b1), fullName(m.b2)], sets: m.sets, winner: m.winner, when: m.played_at,
        changes: Object.keys(m.changes).map(function (id) { return [fullName(id), m.changes[id].change]; }) });
    }
    if (p.kind === 'session' && sessions[p.game_id]) {
      var g = sessions[p.game_id], ch = {};
      Object.keys(g.changes).forEach(function (id) { ch[id] = g.changes[id].change; });
      var rows = PadPal.sessions.rows(g.session_state, ch);
      var mine = rows.filter(function (x) { return x.id === profile.id; })[0];
      return PadPal.share.session({ title: PadPal.sessions.KINDS[g.kind] || '🔄 Session', when: g.scheduled_at, place: g.place,
        top: rows.slice(0, 3).map(function (x) { return { name: fullName(x.id), total: x.total, place: x.place }; }),
        me: mine ? { name: fullName(mine.id), place: mine.place, n: rows.length, total: mine.total, w: mine.w, l: mine.l, d: mine.d } : null });
    }
    if (p.kind === 'tournament' && tourneys[p.tournament_id]) {
      var t = tourneys[p.tournament_id];
      var top = t.tournament_teams.filter(function (tm) { return tm.place && tm.place <= 3; }).sort(function (x, y) { return x.place - y.place; });
      return PadPal.share.session({ title: '🏆 ' + t.name, when: p.created_at,
        top: top.map(function (tm) { return { name: fullName(tm.p1).split(' ')[0] + ' & ' + fullName(tm.p2).split(' ')[0], total: '', place: tm.place }; }), me: null });
    }
    if (p.kind === 'rankup') {
      var to = tierByName((p.body || '').split('|')[1]);
      var who = Object.assign({}, people[p.author_id] || a);
      return PadPal.levels.shareCard(to, who);
    }
    return PadPal.share.post({ name: nameOf(a), text: p.body, photoUrl: p.photo_path ? urls[p.photo_path] : null, when: p.created_at });
  }

  function profileLink(id) { return id === profile.id ? 'profile.html' : 'profile.html?id=' + id; }

  // All posts, or only from your PadPals (people you played with) and you
  var feedFilter = 'all';
  var myPals = null;   // id → true
  function renderFeed() {
    var shown = posts;
    if (feedFilter === 'pals' && myPals) shown = posts.filter(function (p) { return p.author_id === profile.id || myPals[p.author_id]; });
    $('feed').innerHTML = shown.length
      ? shown.map(renderPost).join('')
      : feedFilter === 'pals'
        ? '<div class="empty-feed"><div class="big">👥</div><p><b>No posts from your PadPals yet.</b></p><p>PadPals are everyone you played a game with. Go play! 🎾</p></div>'
        : '<div class="empty-feed"><div class="big">🎾</div><p><b>No posts yet.</b></p><p>Be the first! Tap the <b>+</b> button to post a photo or a message.</p></div>';
  }
  async function setFeedFilter(f) {
    if (f === 'pals' && !myPals) {
      var r = await db.rpc('padpals', { p_user: profile.id });
      if (r.error) return toast('PadPals need an update: run 16_social.sql in Supabase');
      myPals = {};
      r.data.forEach(function (x) { myPals[x.user_id] = true; });
    }
    feedFilter = f;
    document.querySelectorAll('#feedChips button').forEach(function (b) { b.classList.toggle('on', b.dataset.ffilter === f); });
    renderFeed();
  }

  function findPost(id) { return posts.filter(function (p) { return p.id === id; })[0]; }

  // ===== Likes =====
  async function toggleLike(id) {
    var p = findPost(id);
    var liked = p.likes.some(function (l) { return l.user_id === profile.id; });
    // update the screen first, then save
    if (liked) p.likes = p.likes.filter(function (l) { return l.user_id !== profile.id; });
    else p.likes.push({ user_id: profile.id });
    renderFeed();
    var r = liked
      ? await db.from('likes').delete().eq('post_id', id).eq('user_id', profile.id)
      : await db.from('likes').insert({ post_id: id });
    if (r.error) { toast(PadPal.friendlyError(r.error)); load(); }
  }

  // ===== Comments =====
  async function openComments(id) {
    commentsFor = id;
    $('commentList').innerHTML = '<p class="meta">Loading…</p>';
    openSheet($('commentsSheet'));
    await renderComments();
  }
  async function renderComments() {
    var r = await db.from('comments')
      .select('id, body, created_at, author:profiles!comments_author_id_fkey(username, display_name, avatar_url)')
      .eq('post_id', commentsFor).order('created_at');
    if (r.error) { $('commentList').innerHTML = '<p class="meta">' + esc(PadPal.friendlyError(r.error)) + '</p>'; return; }
    var paths = r.data.map(function (c) { return c.author && c.author.avatar_url; }).filter(function (x) { return x && !urls[x]; });
    try { Object.assign(urls, await PadPal.photoUrls(paths)); } catch (err) {}
    $('commentList').innerHTML = r.data.length
      ? r.data.map(function (c) {
          return '<div class="comment"><div class="avatar">' + avatarHtml(c.author) + '</div>' +
            '<div><b>' + esc(c.author ? c.author.username : '') + '</b>' + esc(c.body) +
            '<div class="when">' + ago(c.created_at) + '</div></div></div>';
        }).join('')
      : '<p class="meta">No comments yet. Be the first! 🎾</p>';
  }
  $('commentForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var text = $('commentInput').value.trim();
    if (!text) return;
    $('commentInput').value = '';
    var r = await db.from('comments').insert({ post_id: commentsFor, body: text });
    if (r.error) return toast(PadPal.friendlyError(r.error));
    var p = findPost(commentsFor);
    if (p) { p.comments = [{ count: (p.comments[0] ? p.comments[0].count : 0) + 1 }]; renderFeed(); }
    renderComments();
  });

  // ===== New posts =====
  // ===== 🏷️ Tag PadPals (people you played with), max 10 =====
  var tags = [];        // ids you're tagging in the post you're writing
  var myPalList = null; // [{ user_id, games }] most games first
  var myStars = {};     // ⭐ favourites
  async function loadTagOptions() {
    if (myPalList) return;
    var r = await db.rpc('padpals', { p_user: profile.id });
    myPalList = r.error ? [] : r.data;
    var f = await db.from('favourites').select('fav_id');
    (f.data || []).forEach(function (x) { myStars[x.fav_id] = true; });
  }
  function renderTagChips() {
    $('tagChips').innerHTML = tags.map(function (id) {
      return '<button type="button" class="tag-chip" data-untagpick="' + id + '">' + esc(fullName(id)) + ' ✕</button>';
    }).join('');
    $('tagOpen').textContent = tags.length ? '👥 Tag more (' + tags.length + '/10)' : '👥 Tag PadPals';
  }
  function renderTagList() {
    var q = $('tagSearch').value.trim().toLowerCase();
    var list = (myPalList || []).filter(function (x) { return people[x.user_id] && tags.indexOf(x.user_id) < 0; })
      .sort(function (a, b) { return (myStars[b.user_id] ? 1 : 0) - (myStars[a.user_id] ? 1 : 0) || b.games - a.games; });
    if (q) list = list.filter(function (x) {
      var p = people[x.user_id];
      return (p.display_name || '').toLowerCase().indexOf(q) > -1 || (p.username || '').toLowerCase().indexOf(q) > -1;
    });
    $('tagList').innerHTML = !(myPalList || []).length
      ? '<p class="meta" style="margin:0">No PadPals yet. Play a game with friends, then you can tag them 🎾</p>'
      : list.length ? list.slice(0, 30).map(function (x) {
          var p = people[x.user_id];
          return '<button type="button" class="tag-row" data-tagpick="' + x.user_id + '"><div class="avatar" data-uid="' + x.user_id + '">' + avatarHtml(p) + '</div>' +
            '<span><b>' + (myStars[x.user_id] ? '⭐ ' : '') + esc(nameOf(p)) + '</b><small>@' + esc(p.username) + ' · played together ' + x.games + '×</small></span><i>＋</i></button>';
        }).join('')
      : '<p class="meta" style="margin:0">No PadPal called "' + esc(q) + '" 🤷</p>';
  }
  $('tagOpen').addEventListener('click', async function () {
    $('tagPanel').hidden = false;
    await loadTagOptions();
    renderTagList();
    $('tagSearch').focus();
  });
  $('tagSearch').addEventListener('input', renderTagList);
  $('composeSheet').addEventListener('click', function (e) {
    var add = e.target.closest('[data-tagpick]'), rm = e.target.closest('[data-untagpick]');
    if (add) {
      if (tags.length >= 10) return toast('Max 10 tags per post');
      tags.push(add.dataset.tagpick);
      $('tagSearch').value = '';
      renderTagChips(); renderTagList();
    } else if (rm) {
      tags = tags.filter(function (id) { return id !== rm.dataset.untagpick; });
      renderTagChips(); if (!$('tagPanel').hidden) renderTagList();
    }
  });

  function startCompose(kind, file) {
    compose = { kind: kind, file: file };
    tags = [];
    renderTagChips();
    $('tagPanel').hidden = true;
    $('tagSearch').value = '';
    $('composeTitle').textContent = kind === 'photo' ? 'New photo' : 'New post';
    $('composeLabel').textContent = kind === 'photo' ? 'Caption (optional)' : "What's up?";
    $('composeText').value = '';
    $('composeText').required = kind === 'text';
    $('composeCount').textContent = '0';
    $('composeNote').hidden = kind !== 'photo';
    if (file) { $('composePreview').src = URL.createObjectURL(file); $('composePreview').hidden = false; }
    else $('composePreview').hidden = true;
    closeSheets();
    openSheet($('composeSheet'));
  }
  $('photoInput').addEventListener('change', function () {
    var file = this.files[0];
    this.value = '';
    if (file) startCompose('photo', file);
  });
  $('composeText').addEventListener('input', function () { $('composeCount').textContent = this.value.length; });
  $('composeForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = $('composeBtn');
    btn.disabled = true;
    btn.textContent = compose.kind === 'photo' ? 'Uploading…' : 'Posting…';
    try {
      var row = { kind: compose.kind, body: $('composeText').value.trim() || null };
      if (compose.kind === 'photo') row.photo_path = await PadPal.uploadPhoto(compose.file, 'post');
      var r = await db.from('posts').insert(row).select('id').single();
      if (r.error) {
        if (row.photo_path) db.storage.from('photos').remove([row.photo_path]);
        throw r.error;
      }
      var tagged = 0;
      if (tags.length) {   // 🏷️ tagged friends get a 🔔
        var t = await db.rpc('tag_post', { p_post: r.data.id, p_users: tags });
        if (t.error) toast(/tag_post/.test(t.error.message) ? 'Posted, but tags need 19_tags.sql in Supabase' : PadPal.friendlyError(t.error));
        else tagged = t.data;
      }
      closeSheets();
      if (!tags.length || tagged) toast((compose.kind === 'photo' ? '📷 Posted! Visible for 24 hours' : '✅ Posted!') + (tagged ? ' · 🏷️ ' + tagged + ' tagged' : ''));
      await load();
      window.scrollTo(0, 0);
    } catch (err) {
      toast(PadPal.friendlyError(err));
    }
    btn.disabled = false;
    btn.textContent = 'Post';
  });

  // ===== Pin a photo to your profile =====
  async function pinPost(id) {
    var p = findPost(id);
    var r = await db.from('pinned_photos').insert({ path: p.photo_path });
    if (r.error) return toast(PadPal.friendlyError(r.error));
    myPins[p.photo_path] = true;
    renderFeed();
    if (viewing && viewing.id === id) $('vPin').hidden = true;
    toast('📌 Pinned to your profile. It stays forever!');
  }

  // ===== Delete a post =====
  async function deletePost(id) {
    if (!tapTwice('delete' + id, 'Tap 🗑️ again to delete this post')) return;
    var p = findPost(id);
    var r = await db.from('posts').delete().eq('id', id);
    if (r.error) return toast(PadPal.friendlyError(r.error));
    if (p.photo_path && p.author_id === profile.id && !myPins[p.photo_path]) db.storage.from('photos').remove([p.photo_path]);
    posts = posts.filter(function (x) { return x.id !== id; });
    renderStories();
    renderFeed();
    toast('🗑️ Post deleted');
  }

  // ===== Photo viewer =====
  function openStory(id) {
    var p = findPost(id);
    viewing = p;
    seen[id] = true;
    $('vAvatar').innerHTML = avatarHtml(p.author);
    $('vName').textContent = nameOf(p.author);
    $('vAgo').textContent = ago(p.created_at);
    $('vImg').src = urls[p.photo_path] || '';
    $('vCap').textContent = p.body || '';
    var mine = p.author_id === profile.id;
    $('vLeft').textContent = mine && myPins[p.photo_path] ? '📌 Pinned to your profile' : '⏳ Disappears in ' + hoursLeft(p.expires_at) + 'h';
    $('vPin').hidden = !(mine && !myPins[p.photo_path]);
    $('viewer').classList.add('open');
  }
  function closeStory() { $('viewer').classList.remove('open'); viewing = null; renderStories(); }
  $('vClose').addEventListener('click', closeStory);
  $('vPin').addEventListener('click', function () { if (viewing) pinPost(viewing.id); });

  // ===== Sheets =====
  function openSheet(el) { el.classList.add('open'); $('backdrop').classList.add('open'); }
  function closeSheets() {
    document.querySelectorAll('.sheet.open').forEach(function (s) { s.classList.remove('open'); });
    $('backdrop').classList.remove('open');
  }
  $('backdrop').addEventListener('click', closeSheets);
  $('fab').addEventListener('click', function () { openSheet($('newSheet')); });
  $('reportForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var r = reportKind === 'session'
      ? await db.rpc('report_session', { p_game: reportFor, p_reason: $('reportText').value })
      : await db.rpc('report_match', { p_match: reportFor, p_reason: $('reportText').value });
    if (r.error) return toast(PadPal.friendlyError(r.error));
    closeSheets();
    toast('📨 Report sent to the admin');
  });

  // ===== One click handler for the feed =====
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-untagme],[data-share],[data-like],[data-comments],[data-story],[data-new],[data-pin],[data-delete],[data-report],[data-report-session],[data-rate],[data-ffilter],[data-sdetail],[data-soon]');
    if (!el) return;
    var d = el.dataset;
    if (d.untagme) {
      if (!tapTwice('untag' + d.untagme, 'Tap again to remove your tag from this post')) return;
      db.rpc('untag_me', { p_post: d.untagme }).then(function (r) {
        if (r.error) return toast(PadPal.friendlyError(r.error));
        tagsOf[d.untagme] = (tagsOf[d.untagme] || []).filter(function (id) { return id !== profile.id; });
        renderFeed(); toast('🏷️ Tag removed');
      });
    }
    else if (d.share) sharePost(findPost(d.share));
    else if (d.ffilter) setFeedFilter(d.ffilter);
    else if (d.sdetail) {
      var g = sessions[d.sdetail], ch = {};
      Object.keys(g.changes).forEach(function (id) { ch[id] = g.changes[id].change; });
      $('detailBody').innerHTML = PadPal.sessions.detail(g, ch, personName, personAvatar, profile.id);
      openSheet($('detailSheet'));
    }
    else if (d.rate) PadPal.openRating(d.rate.split(','));
    else if (d.report) openReport(d.report, 'match');
    else if (d.reportSession) openReport(d.reportSession, 'session');
    else if (d.like) toggleLike(d.like);
    else if (d.comments) openComments(d.comments);
    else if (d.story) openStory(d.story);
    else if (d.pin) pinPost(d.pin);
    else if (d.delete) deletePost(d.delete);
    else if (d.new === 'photo') { closeSheets(); $('photoInput').click(); }
    else if (d.new === 'text') startCompose('text');
    else if (d.soon) { e.preventDefault(); closeSheets(); toast('🚧 ' + d.soon + ': coming in a later step'); }
  });
</script>
</body>
</html>
