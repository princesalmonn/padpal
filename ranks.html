<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PadPal Ranks</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="PadPal">
<meta name="theme-color" content="#0B1426">
<link rel="stylesheet" href="styles.css?v=20">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20"></script>
<script src="auth.js?v=20"></script>
<script src="levels.js?v=20"></script>
<script src="sessions.js?v=20"></script>
<script>PadPal.me = PadPal.guard(); // members only</script>
<style>
  /* ===== Ranks-only styles ===== */
  .disclaimer {
    border: 1px dashed var(--accent); color: var(--accent); border-radius: 12px;
    padding: 9px 12px; font-size: 13px; text-align: center; margin: 4px 0 12px; font-weight: 600;
  }

  .search { position: relative; margin-bottom: 12px; }
  .search input {
    width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 11px 14px 11px 38px; font: inherit; font-size: 16px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: .7; }

  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; border: 0; background: none; padding: 9px 0; border-radius: 9px; font-size: 14px; color: var(--text-2); font-weight: 600; }
  .seg button.on { background: var(--primary); color: var(--primary-text); }

  .periods { display: flex; gap: 6px; margin-bottom: 6px; }
  .periods button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--text-2); }
  .periods button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .explain { font-size: 12px; color: var(--text-2); margin: 0 0 14px; }

  /* Podium (top 3) */
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; margin-bottom: 14px; }
  .step { text-align: center; border: 0; background: none; padding: 0; min-width: 0; }
  .step .avatar { margin: 0 auto 6px; }
  .step .crown { font-size: 20px; height: 24px; }
  .step .nm { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .pt { font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .block { border-radius: 12px 12px 4px 4px; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: #1C1F24; }
  .p1 .block { height: 92px; background: linear-gradient(180deg, #E3C46F, #A88330); }
  .p2 .block { height: 68px; background: linear-gradient(180deg, #D6DAE0, #8E959F); }
  .p3 .block { height: 52px; background: linear-gradient(180deg, #D9A066, #B87333); }
  /* colour follows the place, so tied players get the same medal colour */
  .step .block.r1 { background: linear-gradient(180deg, #E3C46F, #A88330); }
  .step .block.r2 { background: linear-gradient(180deg, #D6DAE0, #8E959F); }
  .step .block.r3 { background: linear-gradient(180deg, #D9A066, #B87333); }
  .p1 .avatar { width: 62px; height: 62px; font-size: 22px; border-color: var(--gold); }
  .p2 .avatar, .p3 .avatar { width: 50px; height: 50px; font-size: 18px; }
  .avatar { overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

  /* List */
  .zone { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); margin: 14px 0 8px; font-weight: 600; }
  .zone::before, .zone::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px;
  }
  .row.me { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .row .pos { width: 24px; text-align: center; font-weight: 800; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .row .info { min-width: 0; flex: 1; }
  .row .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .row .sub { font-size: 12px; color: var(--text-2); display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
  .row .score { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .row .score small { display: block; font-size: 11px; font-weight: 600; }
  .up { color: var(--win); }
  .down { color: var(--loss); }
  .same { color: var(--text-2); }
  .ice { font-size: 11px; background: color-mix(in srgb, #4F7CAC 25%, transparent); color: #8FB3DA; padding: 1px 6px; border-radius: 999px; }
  .empty { text-align: center; color: var(--text-2); padding: 30px 0; }

  /* Player pop-up */
  .pp-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .pp-head .avatar { width: 56px; height: 56px; font-size: 22px; }
  .pp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .pp-grid div { background: var(--card-2); border-radius: 12px; padding: 10px; text-align: center; }
  .pp-grid strong { display: block; font-size: 18px; }
  .pp-grid small { font-size: 11px; color: var(--text-2); }
  .pp-btns { display: flex; gap: 8px; }
  .pp-btns .btn { flex: 1; padding: 11px; font-size: 14px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><img class="logo-img logo-for-dark" src="logo-dark.svg" alt=""><img class="logo-img logo-for-light" src="logo-light.svg" alt=""><span>Pad</span><b>Pal</b></div>
    <button class="icon-btn" id="rulesBtn" aria-label="How ranking works">❔</button>
  </div>
</header>

<main class="wrap">
  <div class="disclaimer">⚠️ If you're not having fun, you're out! 😄</div>

  <div class="search"><span>🔍</span><input id="search" placeholder="Search players…" autocomplete="off"></div>

  <div class="seg" id="ladders">
    <button class="on" data-ladder="men">👨 Men</button>
    <button data-ladder="women">👩 Women</button>
    <button data-ladder="mixed">🔀 Mixed</button>
  </div>

  <div class="periods" id="periods">
    <button data-period="week">Week</button>
    <button data-period="month">Month</button>
    <button data-period="year">Year</button>
    <button class="on" data-period="all">All time</button>
  </div>
  <p class="explain" id="explain"></p>

  <div class="error-box" id="error" role="alert" hidden></div>
  <div id="podium" class="podium"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>

<!-- Bottom tab bar -->
<nav class="tabbar">
  <div class="tabs">
    <a href="feed.html"><span>🏠</span>Feed</a>
    <a href="play.html"><span>🎾</span>Play</a>
    <a href="chat.html"><span>💬</span>Chat</a>
    <a class="on" href="ranks.html"><span>🏆</span>Ranks</a>
    <a href="profile.html"><span>👤</span>Me</a>
  </div>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="playerSheet">
  <div class="grab"></div>
  <div id="playerBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  var db = PadPal.db;
  var me = null;
  var players = [];     // all members, with their stats
  var changes = [];     // every points change (small friends group, so we load them all)
  var urls = {};        // avatar links
  var state = { ladder: 'men', period: 'all', q: '' };
  var DAYS = { week: 7, month: 30, year: 365 };

  // ===== Helpers =====
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function nameOf(p) { return p.display_name || p.username; }
  function avatar(p) {
    var url = p.avatar_url && urls[p.avatar_url];
    return '<div class="avatar" data-uid="' + p.id + '" style="border-color:' + PadPal.tierOf(p.points).color + '">' +
      (url ? '<img src="' + url + '" alt="">' : esc(nameOf(p)[0].toUpperCase())) + '</div>';
  }
  function pill(p) {
    var t = PadPal.tierOf(p.points);
    return '<span class="pill">' + t.icon + ' ' + t.name + '</span>';
  }
  function daysIdle(p) {
    if (!p.last_played) return null;
    return Math.floor((Date.now() - new Date(p.last_played + 'T00:00:00')) / 86400000);
  }
  function since(days) { return Date.now() - days * 86400000; }

  // ===== Load =====
  PadPal.me.then(async function (who) {
    if (!who) return;
    me = who.profile;
    try {
      var r = await db.from('profiles')
        .select('id, username, display_name, gender, avatar_url, points, mixed_points, last_played, fav_shot')
        .eq('status', 'approved').not('username', 'is', null);
      if (r.error) throw r.error;
      players = r.data;
      var c = await db.from('point_changes').select('user_id, change, mixed_change, reason, created_at')
        .order('created_at', { ascending: false }).limit(10000);
      if (c.error) throw c.error;
      changes = c.data;
    } catch (err) {
      $('error').textContent = PadPal.friendlyError(err);
      $('error').hidden = false;
      $('list').innerHTML = '';
      return;
    }
    // per-player numbers from the history
    players.forEach(function (p) {
      p.wins = 0; p.losses = 0;
      p.week = 0; p.month = 0; p.year = 0; p.mweek = 0; p.mmonth = 0; p.myear = 0;
    });
    var byId = {};
    players.forEach(function (p) { byId[p.id] = p; });
    changes.forEach(function (c) {
      var p = byId[c.user_id];
      if (!p) return;
      var t = new Date(c.created_at).getTime();
      if (c.reason === 'win') p.wins++;
      if (c.reason === 'loss') p.losses++;
      ['week', 'month', 'year'].forEach(function (k) {
        if (t >= since(DAYS[k])) { p[k] += Number(c.change); p['m' + k] += Number(c.mixed_change); }
      });
    });
    // W-L counts every match: normal matches (above), every game inside a session, and tournament matches
    players.forEach(function (p) { p.draws = 0; });
    try {
      var sg = await db.from('games').select('id, kind, scheduled_at, session_state').eq('status', 'done').neq('kind', 'match');
      (sg.data || []).forEach(function (g) {
        if (!g.session_state || !g.session_state.players) return;
        g.session_state.players.forEach(function (id) {
          var p = byId[id];
          if (!p) return;
          PadPal.sessions.gamesOf(g, id).forEach(function (x) { if (x.won) p.wins++; else if (x.lost) p.losses++; else p.draws++; });
        });
      });
      var tt = await db.from('tournament_teams').select('id, p1, p2');
      var tm = await db.from('tournament_matches').select('team_a, team_b, winner').not('winner', 'is', null);
      var team = {};
      (tt.data || []).forEach(function (t) { team[t.id] = t; });
      (tm.data || []).forEach(function (m) {
        ['a', 'b'].forEach(function (side) {
          var t = team[side === 'a' ? m.team_a : m.team_b];
          if (!t) return;
          [t.p1, t.p2].forEach(function (id) { var p = byId[id]; if (!p) return; if (m.winner === side) p.wins++; else p.losses++; });
        });
      });
    } catch (err) {}
    try { urls = await PadPal.photoUrls(players.map(function (p) { return p.avatar_url; })); } catch (err) {}
    render();
  });

  // ===== Ranking for the chosen ladder + period =====
  function valueOf(p) {
    var mixed = state.ladder === 'mixed';
    if (state.period === 'all') return Number(mixed ? p.mixed_points : p.points);
    return Math.round((mixed ? p['m' + state.period] : p[state.period]) * 10) / 10;
  }
  function inLadder(p) {
    if (state.ladder === 'men') return p.gender === 'm';
    if (state.ladder === 'women') return p.gender === 'f';
    return true;  // mixed: everyone (people without mixed games sit at the bottom)
  }
  function playedMixed(p) { return Number(p.mixed_points) !== 0 || p.mweek || p.mmonth || p.myear; }
  // Same rule as everywhere (PadPal.rankPlayers): equal points share a place
  function ranking() {
    var mixed = state.ladder === 'mixed';
    var inIt = players.filter(inLadder);
    if (!mixed) return PadPal.rankPlayers(inIt, valueOf);
    // Mixed: people without mixed games come last, sharing one place
    var played = PadPal.rankPlayers(inIt.filter(playedMixed), valueOf);
    var none = PadPal.rankPlayers(inIt.filter(function (p) { return !playedMixed(p); }), function () { return 0; });
    none.forEach(function (x) { x.noMixed = true; x.rank = played.length + 1; x.tied = none.length; });
    return played.concat(none);
  }
  // Places moved this week: compare with the ranking 7 days ago (same tie rule)
  function movement(list) {
    if (state.period !== 'all') return {};
    var mixed = state.ladder === 'mixed';
    var weekAgo = {};
    list.forEach(function (x) { weekAgo[x.p.id] = x.value - (mixed ? x.p.mweek : x.p.week); });
    var oldRank = {};
    PadPal.rankPlayers(list.map(function (x) { return x.p; }), function (p) { return weekAgo[p.id]; })
      .forEach(function (x) { oldRank[x.p.id] = x.rank; });
    var move = {};
    list.forEach(function (x) { move[x.p.id] = x.noMixed ? 0 : oldRank[x.p.id] - x.rank; });
    return move;
  }
  function valueText(v) { return state.period === 'all' ? PadPal.fmt(v) : PadPal.fmtChange(v); }

  // ===== Draw =====
  function render() {
    var ladderName = { men: "men's ladder", women: "women's ladder", mixed: 'Mixed points (games with men and women)' }[state.ladder];
    $('explain').textContent = state.period === 'all'
      ? 'Total points · ' + ladderName
      : 'Points gained in the last ' + { week: '7 days', month: '30 days', year: '12 months' }[state.period] + ' · ' + ladderName;

    var list = ranking();
    var move = movement(list);
    var q = state.q.toLowerCase();
    var searching = q.length > 0;
    var shown = list.filter(function (x) {
      return !searching || nameOf(x.p).toLowerCase().indexOf(q) > -1 || x.p.username.indexOf(q) > -1;
    });

    if (!list.length) {
      $('podium').style.display = 'none';
      $('list').innerHTML = '<div class="empty">' + (state.ladder === 'mixed'
        ? 'Nobody has played a mixed game yet. 🔀'
        : 'No ' + (state.ladder === 'men' ? 'men' : 'women') + ' in PadPal yet. Invite some! 🎾') + '</div>';
      return;
    }

    // podium only when somebody actually has points (0 for everyone = everyone tied, no winner yet)
    var podium = !searching && shown.length >= 3 && shown[0].value > 0 && !shown.slice(0, 3).some(function (x) { return x.noMixed; });
    if (!searching && list[0].value <= 0 && list[0].tied > 1) {
      $('explain').textContent += ' · No points yet: everyone shares #1 🤝';
    }
    if (podium) {
      var order = [shown[1], shown[0], shown[2]];
      var cls = ['p2', 'p1', 'p3'];
      $('podium').innerHTML = order.map(function (x, i) {
        return '<button class="step ' + cls[i] + '" data-player="' + x.p.id + '">' +
          '<div class="crown">' + (x.rank === 1 ? '👑' : '') + '</div>' + avatar(x.p) +
          '<div class="nm" data-uid="' + x.p.id + '">' + esc(nameOf(x.p)) + (x.p.id === me.id ? ' (you)' : '') + '</div>' +
          '<div class="pt">' + valueText(x.value) + ' pts</div>' +
          '<div class="block r' + Math.min(x.rank, 3) + '">' + x.rank + '</div></button>';
      }).join('');
      $('podium').style.display = 'grid';
    } else {
      $('podium').style.display = 'none';
    }

    var rest = podium ? shown.slice(3) : shown;
    if (!rest.length && searching) {
      $('list').innerHTML = '<div class="empty">No player called "' + esc(state.q) + '" 🤷</div>';
      return;
    }
    var html = '';
    var lastZone = null;
    rest.forEach(function (x) {
      var p = x.p;
      if (state.period === 'all' && state.ladder !== 'mixed' && !searching) {
        var t = PadPal.tierOf(p.points);
        if (t.name !== lastZone) { html += '<div class="zone">' + t.icon + ' ' + t.name + ' zone</div>'; lastZone = t.name; }
      }
      var m = move[p.id] || 0;
      var arrow = state.period !== 'all' ? '' : m > 0 ? '<span class="up">▲' + m + '</span>' : m < 0 ? '<span class="down">▼' + (-m) + '</span>' : '<span class="same">–</span>';
      var idle = daysIdle(p);
      html += '<button class="row' + (p.id === me.id ? ' me' : '') + '" data-player="' + p.id + '">' +
        '<div class="pos">' + x.rank + '</div>' + avatar(p) +
        '<div class="info"><div class="nm" data-uid="' + p.id + '">' + esc(nameOf(p)) + (p.id === me.id ? ' <span class="meta">(you)</span>' : '') + '</div>' +
        '<div class="sub">' + pill(p) + (x.noMixed ? '<span class="meta" style="font-size:11px">no mixed games yet</span>' : '') +
          (idle !== null && idle >= 7 ? '<span class="ice">🧊 ' + idle + 'd idle</span>' : '') + '</div></div>' +
        '<div class="score">' + valueText(x.value) + '<small>' + arrow + '</small></div></button>';
    });
    $('list').innerHTML = html;
  }

  // ===== Player pop-up =====
  function openPlayer(id) {
    var p = players.filter(function (x) { return x.id === id; })[0];
    var games = p.wins + p.losses + p.draws;
    var rate = games ? Math.round(p.wins / games * 100) + '%' : '–';
    var idle = daysIdle(p);
    $('playerBody').innerHTML =
      '<div class="pp-head">' + avatar(p) +
        '<div><div class="name" data-uid="' + p.id + '">' + esc(nameOf(p)) + (p.id === me.id ? ' (you)' : '') + '</div><div class="meta">@' + esc(p.username) + '</div>' +
        '<div style="margin-top:4px">' + pill(p) + '</div></div></div>' +
      '<div class="pp-grid">' +
        '<div><strong>' + PadPal.fmt(p.points) + '</strong><small>Points</small></div>' +
        '<div><strong>' + rate + '</strong><small>Win rate</small></div>' +
        '<div><strong>' + p.wins + '-' + p.losses + (p.draws ? '-' + p.draws : '') + '</strong><small>' + (p.draws ? 'W-L-D' : 'W-L') + '</small></div>' +
      '</div>' +
      '<p class="meta" style="margin:0 0 12px">🔀 Mixed: <b style="color:var(--text)">' + PadPal.fmt(p.mixed_points) + '</b> pts' +
        (p.fav_shot ? ' · 🎯 Fav shot: <b style="color:var(--text)">' + esc(p.fav_shot) + '</b>' : '') +
        ' · ' + (idle === null ? 'No games yet' : idle === 0 ? 'Played today 🔥' : 'Last game ' + idle + 'd ago') + '</p>' +
      (p.id === me.id
        ? '<div class="pp-btns"><a class="btn btn-primary" href="profile.html" style="text-align:center;text-decoration:none">View my profile</a></div>'
        : '<div class="pp-btns"><a class="btn btn-ghost" href="chat.html?with=' + p.id + '" style="text-align:center;text-decoration:none">💬 Message</a>' +
          '<a class="btn btn-primary" href="profile.html?id=' + p.id + '" style="text-align:center;text-decoration:none">👤 View profile</a></div>');
    $('playerSheet').classList.add('open');
    $('backdrop').classList.add('open');
  }
  function closePlayer() {
    $('playerSheet').classList.remove('open');
    $('backdrop').classList.remove('open');
  }
  $('backdrop').addEventListener('click', closePlayer);

  // How ranking works
  $('rulesBtn').addEventListener('click', function () {
    $('playerBody').innerHTML = '<h3>❔ How points work</h3>' +
      '<p class="meta" style="line-height:1.6;margin:0">' +
      '🏆 <b>Win</b> +2 · stronger team +1 per tier (max +5) · weaker team +1<br>' +
      '😓 <b>Lose</b> to stronger 0 · same level −2 · weaker −2 −1 per tier (max −5)<br>' +
      '🎾 <b>+0.5</b> for showing up (once a day)<br>' +
      '🚀 <b>Double</b> gains in your first 10 match days<br>' +
      '🐣 <b>First Timers</b> (under 100) never lose points<br>' +
      '🛑 Normal games stop at <b>500</b>. Above that: official tournaments only<br>' +
      '🧢 Normal-match wins give at most <b>+10 a day</b> (new players +20). Sessions have no cap<br>' +
      '👨👩 Everyone is calculated on <b>their own ladder</b>. Mixed games also add 🔀 Mixed points.<br>' +
      '🔄 <b>Americano/Mexicano</b>: only your final place counts (8 players: 🥇 +6 · 🥈 +4 · 🥉 +3 … last −3)<br>' +
      '🎯 <b>Shot ratings</b> from friends: rating × 0.1 per shot, max 3 shots a day<br>' +
      '🧊 <b>No game for a week</b>: −1 point every week (−2 after 4 weeks), and your skill points shrink after 4 weeks. First Timers are safe.</p>';
    $('playerSheet').classList.add('open');
    $('backdrop').classList.add('open');
  });

  // ===== Clicks & typing =====
  $('search').addEventListener('input', function () { state.q = this.value.trim(); render(); });
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-ladder],[data-period],[data-player]');
    if (!el) return;
    if (el.dataset.ladder) {
      state.ladder = el.dataset.ladder;
      document.querySelectorAll('#ladders button').forEach(function (b) { b.classList.toggle('on', b === el); });
      render();
    } else if (el.dataset.period) {
      state.period = el.dataset.period;
      document.querySelectorAll('#periods button').forEach(function (b) { b.classList.toggle('on', b === el); });
      render();
    } else if (el.dataset.player) {
      openPlayer(el.dataset.player);
    }
  });
</script>
</body>
</html>
