  // =====================================================
  // 3. AMERICANO / MEXICANO SESSIONS
  // =====================================================
  // A session belongs to a lobby game: the joined players play, the host keeps score.
  // Everything is saved after each game, so nothing is lost and players can follow along.
  var session = null;      // the running session (players are member ids)
  var sessionGame = null;  // its game id

  // Save the session to the database (host only)
  async function persistSession() {
    if (!sessionGame) return;
    var r = await db.rpc('save_session_state', { p_game: sessionGame, p_state: session });
    if (r.error) toast('⚠️ Not saved: ' + PadPal.friendlyError(r.error));
  }

  // How many times two players have been partners
  function partnerKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  // Players still in the rotation (not taken out by the host)
  function activeOf(s) {
    return s.players.filter(function (id) { return !(s.out && s.out[id]); });
  }

  // Make the next round: who plays, who rests, who partners whom
  function makeRound() {
    var f = session.format;
    if (f === 'team_americano' || f === 'round_robin') return session.plan[session.rounds.length];
    if (f === 'king') return kingRound();
    var busy = busyOf(session);
    var r = f === 'mixicano' ? mixicanoRound() : americanoRound();
    r.busy = activeOf(session).filter(function (id) { return busy[id]; });   // still on court in an earlier round
    return r;
  }
  // Players who can play the next round: not taken out, not still on court
  function freeOf(s) {
    var busy = busyOf(s);
    return activeOf(s).filter(function (id) { return !busy[id]; });
  }

  // 🔀 Mixicano: always 1 man + 1 woman. Top man plays with the lower woman of his court.
  function mixicanoRound() {
    var s = session;
    function gender(id) { var p = personById(id); return p && p.gender === 'f' ? 'f' : 'm'; }
    function pick(list) {   // fewest games first (fair resting), then best ranked first
      return list.sort(function (a, b) { return (s.played[a] - s.played[b]) || (s.points[b] - s.points[a]) || (Math.random() - 0.5); });
    }
    var men = pick(freeOf(s).filter(function (id) { return gender(id) === 'm'; }));
    var women = pick(freeOf(s).filter(function (id) { return gender(id) === 'f'; }));
    var courtsNow = Math.max(1, Math.min(s.courts, Math.floor(Math.min(men.length, women.length) / 2)));
    var n = courtsNow * 2;
    var pm = men.slice(0, n), pw = women.slice(0, n);
    if (s.rounds.length === 0) { pm.sort(function () { return Math.random() - 0.5; }); pw.sort(function () { return Math.random() - 0.5; }); }
    else { pm.sort(function (a, b) { return s.points[b] - s.points[a]; }); pw.sort(function (a, b) { return s.points[b] - s.points[a]; }); }
    var matches = [];
    for (var c = 0; c < courtsNow; c++) {
      var M = pm.slice(c * 2, c * 2 + 2), W = pw.slice(c * 2, c * 2 + 2);
      matches.push({ a: [M[0], W[1]], b: [M[1], W[0]], score: null });
    }
    return { matches: matches, resting: men.slice(n).concat(women.slice(n)) };
  }

  // 👑 King of the Court: winners move up a court, losers move down. Court 1 is the king court.
  function kingRound() {
    var s = session;
    var prev = s.rounds[s.rounds.length - 1];
    var k = s.courts;
    if (!prev) {
      var order = s.players.slice().sort(function () { return Math.random() - 0.5; });
      var ms = [];
      for (var c = 0; c < k; c++) { var q = order.slice(c * 4, c * 4 + 4); ms.push({ a: [q[0], q[1]], b: [q[2], q[3]], score: null }); }
      return { matches: ms, resting: order.slice(k * 4) };
    }
    var courts = [];
    for (var i = 0; i < k; i++) courts.push([]);
    prev.matches.forEach(function (m, i) {
      if (!m.score) { courts[i] = courts[i].concat(m.a, m.b); return; }   // skipped game: both teams stay on their court
      var aWon = m.score[0] >= m.score[1];
      var W = aWon ? m.a : m.b, L = aWon ? m.b : m.a;
      courts[Math.max(0, i - 1)] = courts[Math.max(0, i - 1)].concat(W);   // winners up (king stays)
      if (i < k - 1) courts[i + 1] = courts[i + 1].concat(L);               // losers down
      else courts[i] = courts[i].concat(['__bottom__', L[0], L[1]]);        // bottom court losers: maybe rest
    });
    // resting players come back on the bottom court; the bottom court's losers rest instead
    var bottom = courts[k - 1];
    var cut = bottom.indexOf('__bottom__');
    var bottomLosers = cut < 0 ? [] : bottom.slice(cut + 1);
    courts[k - 1] = cut < 0 ? bottom : bottom.slice(0, cut);
    var pool = prev.resting.concat(bottomLosers);
    while (courts[k - 1].length < 4 && pool.length) courts[k - 1].push(pool.shift());

    // players taken out leave their court; newcomers wait at the bottom
    var active = {};
    activeOf(s).forEach(function (id) { active[id] = true; });
    var seen = {};
    prev.matches.forEach(function (m) { m.a.concat(m.b).forEach(function (id) { seen[id] = true; }); });
    prev.resting.forEach(function (id) { seen[id] = true; });
    var newcomers = activeOf(s).filter(function (id) { return !seen[id]; });
    var ordered = [].concat.apply([], courts).filter(function (id) { return active[id]; })   // king court first
      .concat(pool.filter(function (id) { return active[id]; }), newcomers);
    var kNow = Math.max(1, Math.min(k, Math.floor(ordered.length / 4)));
    var matches = [];
    for (var c = 0; c < kNow; c++) {
      var q = ordered.slice(c * 4, c * 4 + 4);
      // one player who came up with one who came down, so partners change every round
      matches.push({ a: [q[0], q[3]], b: [q[1], q[2]], score: null });
    }
    return { matches: matches, resting: ordered.slice(kNow * 4) };
  }

  // 🤝 Team Americano / ⭕ Round Robin: fixed teams, everyone plays everyone (circle method)
  function teamPlan(teams, courts, maxRounds) {
    var list = teams.map(function (t, i) { return i; });
    if (list.length % 2) list.push(null);                       // odd → one team rests
    var pairings = [];
    for (var r = 0; r < list.length - 1; r++) {
      for (var i = 0; i < list.length / 2; i++) {
        var a = list[i], b = list[list.length - 1 - i];
        if (a !== null && b !== null) pairings.push([a, b]);
      }
      list.splice(1, 0, list.pop());                             // rotate, first team stays
    }
    // fill rounds: max `courts` games, a team plays once per round
    var rounds = [];
    while (pairings.length && rounds.length < maxRounds) {
      var busy = {}, games = [];
      for (var j = 0; j < pairings.length && games.length < courts; j++) {
        var p = pairings[j];
        if (!busy[p[0]] && !busy[p[1]]) { games.push(p); busy[p[0]] = busy[p[1]] = true; pairings.splice(j, 1); j--; }
      }
      var playing = {};
      games.forEach(function (gm) { teams[gm[0]].concat(teams[gm[1]]).forEach(function (id) { playing[id] = true; }); });
      rounds.push({
        matches: games.map(function (gm) { return { a: teams[gm[0]].slice(), b: teams[gm[1]].slice(), score: null }; }),
        resting: [].concat.apply([], teams).filter(function (id) { return !playing[id]; })
      });
    }
    return rounds;
  }

  // Pairs for team formats: strongest with weakest (or 1 man + 1 woman when possible)
  function makeTeams(players) {
    var sorted = players.slice().sort(function (a, b) {
      return Number((personById(b) || {}).points || 0) - Number((personById(a) || {}).points || 0);
    });
    var teams = [];
    while (sorted.length >= 2) teams.push([sorted.shift(), sorted.pop()]);
    return teams;
  }

  // ⚡ Americano (and Mexicano): Mexicano pairs by ranking from round 2
  function americanoRound() {
    var s = session;
    var free = freeOf(s);
    var courtsNow = Math.max(1, Math.min(s.courts, Math.floor(free.length / 4)));   // fewer courts if people left or are still playing
    var courtsNeeded = courtsNow * 4;
    var order;
    if (s.format === 'mexicano' && s.rounds.length > 0) {
      // ranking order (most points first), but people who rested least sit out first
      order = free.sort(function (a, b) {
        return (s.played[a] - s.played[b]) || (s.points[b] - s.points[a]);
      });
      var playing = order.slice(0, courtsNeeded).sort(function (a, b) { return s.points[b] - s.points[a]; });
      var resting = order.slice(courtsNeeded);
      var matches = [];
      for (var c = 0; c < courtsNow; c++) {
        var g = playing.slice(c * 4, c * 4 + 4);
        matches.push({ a: [g[0], g[3]], b: [g[1], g[2]], score: null });
      }
      return { matches: matches, resting: resting };
    }
    // Americano (and Mexicano round 1): fewest games first, then avoid repeat partners
    var shuffled = free.sort(function () { return Math.random() - 0.5; });
    order = shuffled.sort(function (a, b) { return s.played[a] - s.played[b]; });
    var playing2 = order.slice(0, courtsNeeded);
    var resting2 = order.slice(courtsNeeded);
    var ms = [];
    for (var k = 0; k < courtsNow; k++) {
      var q = playing2.slice(k * 4, k * 4 + 4);
      var options = [[[q[0], q[1]], [q[2], q[3]]], [[q[0], q[2]], [q[1], q[3]]], [[q[0], q[3]], [q[1], q[2]]]];
      options.sort(function (x, y) {
        function cost(o) { return (s.partners[partnerKey(o[0][0], o[0][1])] || 0) + (s.partners[partnerKey(o[1][0], o[1][1])] || 0); }
        return cost(x) - cost(y);
      });
      ms.push({ a: options[0][0], b: options[0][1], score: null });
    }
    return { matches: ms, resting: resting2 };
  }

  // Start (or continue) the session of a lobby game
  async function startSessionFromLobby(g) {
    if (g.session_state) {
      session = g.session_state;
    } else {
      var players = joinedOf(g);
      var st = g.settings || {};
      var courts = Math.max(1, Math.min(st.courts || 2, Math.floor(players.length / 4)));
      var problem = null;
      var chosen = st.rounds || 0;   // 0 = automatic
      var totalRounds = chosen || Math.min(7, Math.max(3, players.length - 1));
      var plan = null;
      if (g.kind === 'mixicano') {
        var nf = players.filter(function (id) { return (personById(id) || {}).gender === 'f'; }).length;
        var nm = players.length - nf;
        if (nf < 2 || nm < 2) problem = 'Mixicano needs at least 2 men and 2 women';
        courts = Math.max(1, Math.min(courts, Math.floor(Math.min(nf, nm) / 2)));
      }
      if (g.kind === 'team_americano' || g.kind === 'round_robin') {
        if (players.length % 2) problem = 'This format has fixed pairs: you need an even number of players';
        else {
          var teams = makeTeams(players);
          courts = Math.max(1, Math.min(courts, Math.floor(teams.length / 2)));
          plan = teamPlan(teams, courts, chosen || (g.kind === 'round_robin' ? 99 : 7));
          totalRounds = plan.length;
        }
      }
      if (g.kind === 'king') {
        courts = Math.max(1, Math.min(courts, Math.floor(players.length / 4)));
        totalRounds = chosen || 6;
      }
      if (problem) { toast('⚠️ ' + problem); return; }
      session = {
        format: g.kind,
        players: players,
        target: st.target || 21,
        scoring: st.scoring || 'points',   // 'points' (16/21/24/32) or 'games' (tennis mini-set)
        gamesTarget: st.games || 4,
        golden: st.golden !== false,
        courts: courts,
        totalRounds: totalRounds,
        plan: plan,
        out: {},              // players taken out: id → { reason, round, sub }
        rounds: [], view: 0,
        points: {}, played: {}, partners: {}
      };
      players.forEach(function (p) { session.points[p] = 0; session.played[p] = 0; });
      session.rounds.push(makeRound());
    }
    sessionGame = g.id;
    closeSheet();
    stopLobby();
    document.querySelector('[data-panel=organize]').click();
    renderSession();
    if (!g.session_state) { await persistSession(); loadGames(); }
  }

  // ===== Changing players during a session (host) =====
  var REASONS = {
    injured: ['🤕', 'Injured'], sick: ['🤒', 'Sick'], tired: ['😴', 'Tired'],
    left: ['🏃', 'Had to leave'], other: ['🤷', 'Other']
  };
  var changeFor = null;    // the player the host is changing
  function isTeamFormat(s) { return s.format === 'team_americano' || s.format === 'round_robin'; }

  // Joined the game but not in the rounds yet (late arrivals)
  function waitingPlayers() {
    var g = gameById(sessionGame);
    return g ? joinedOf(g).filter(function (id) { return session.players.indexOf(id) < 0; }) : [];
  }

  function openPlayers() {
    var s = session;
    s.out = s.out || {};
    var html = '<h3>👥 Players</h3><p class="meta" style="margin:-6px 0 10px">Changes start from the <b>next round</b>. Everyone keeps the points they already have.</p>';
    html += '<div class="card" style="padding:4px 12px">' + s.players.map(function (id) {
      var o = s.out[id];
      return '<div class="lb-row"><span>' + (o ? REASONS[o.reason][0] + ' ' : '') + nameOfId(id) + '</span>' +
        '<small>' + (o ? REASONS[o.reason][1] + (o.sub ? ' · replaced by ' + nameOfId(o.sub) : '') : s.points[id] + ' pts') + '</small>' +
        (o ? (o.sub ? '' : '<button class="btn btn-ghost" style="margin-left:auto;padding:4px 10px;font-size:12px" data-pback="' + id + '">↩️ Back in</button>')
           : '<button class="btn btn-ghost" style="margin-left:auto;padding:4px 10px;font-size:12px" data-pout="' + id + '">' + (isTeamFormat(s) ? '🔄 Substitute' : '➖ Take out') + '</button>') +
        '</div>';
    }).join('') + '</div>';
    if (!isTeamFormat(s)) {
      var waiting = waitingPlayers();
      html += '<div class="label">➕ Add to the rounds</div>' +
        (waiting.length ? '<div class="pick">' + waiting.map(function (id) { return '<button data-padd="' + id + '">➕ ' + nameOfId(id) + '</button>'; }).join('') + '</div>'
          : '<p class="note" style="margin-top:0">Nobody new yet. Send them the join link, then add them here.</p>');
    } else {
      html += '<p class="note">Fixed-partner format: someone who can\'t continue is replaced by a substitute, so their partner keeps playing.</p>';
    }
    html += '<button class="btn btn-ghost" style="width:100%;margin-top:12px" data-pshare="1">🔗 Share join link</button>';
    openSheet(html);
  }

  function openReason(id) {
    changeFor = id;
    openSheet('<h3>Why is ' + nameOfId(id) + ' stopping?</h3><p class="meta" style="margin:-6px 0 12px">Their points so far still count in the ranking.</p>' +
      '<div class="pick">' + Object.keys(REASONS).map(function (k) { return '<button data-preason="' + k + '">' + REASONS[k][0] + ' ' + REASONS[k][1] + '</button>'; }).join('') + '</div>' +
      '<button class="btn btn-ghost" style="width:100%;margin-top:14px" data-pplayers="1">Back</button>');
  }

  function openSubstitute(reason) {
    var s = session;
    var options = waitingPlayers().concat(s.players.filter(function (id) { return s.out[id] && !s.out[id].sub && id !== changeFor; }));
    openSheet('<h3>🔄 Who replaces ' + nameOfId(changeFor) + '?</h3>' +
      (options.length ? '<div class="pick">' + options.map(function (id) { return '<button data-psub="' + id + '|' + reason + '">' + nameOfId(id) + '</button>'; }).join('') + '</div>'
        : '<p class="meta">Nobody available. Send the join link to a friend, and once they join they appear here.</p>') +
      '<button class="btn btn-ghost" style="width:100%;margin-top:14px" data-pplayers="1">Back</button>');
  }

  function takeOut(id, reason, sub) {
    var s = session;
    s.out = s.out || {};
    s.out[id] ={ reason: reason, round: s.rounds.length + 1, sub: sub || null };
    if (sub) {
      if (s.players.indexOf(sub) < 0) { s.players.push(sub); s.points[sub] = 0; s.played[sub] = 0; }
      if (s.out[sub]) delete s.out[sub];
      // the substitute takes the leaver's place in every round that hasn't started yet
      (s.plan || []).forEach(function (r, i) {
        if (i < s.rounds.length) return;
        r.matches.forEach(function (m) { m.a = m.a.map(swap); m.b = m.b.map(swap); });
        r.resting = r.resting.map(swap);
      });
    }
    function swap(x) { return x === id ? sub : x; }
    afterChange((sub ? '🔄 ' + nameOfId(sub) + ' replaces ' : REASONS[reason][0] + ' ') + nameOfId(id) + (sub ? '' : ' is out'));
  }

  function afterChange(msg) {
    renderSession();
    persistSession();
    openPlayers();
    toast(msg);
  }

  // Finish: the database ranks everyone and gives the session points
  async function finishSession(btn) {
    btn.disabled = true;
    btn.textContent = 'Saving…';
    var r = await db.rpc('finish_session', { p_game: sessionGame });
    if (r.error) { btn.disabled = false; btn.textContent = '🏁 Finish & give points'; return toast(PadPal.friendlyError(r.error)); }
    var res = r.data.results;
    var changes = {};
    res.forEach(function (x) { changes[x.user_id] = x.change; });
    var list = PadPal.sessions.rows(session, changes);
    openSheet('<h3>🏁 Session finished!</h3>' +
      PadPal.sessions.podium(list, nameOfId, avatarOfId) +
      '<div class="card" style="padding:4px 12px">' + PadPal.sessions.table(list, nameOfId, me.id) + '</div>' +
      '<p class="note">Posted to the Feed 📣 Points are on everyone\'s profile.</p>' +
      '<button class="btn btn-accent" style="width:100%;margin-top:12px" data-rate="' + res.map(function (x) { return x.user_id; }).join(',') + '">🎯 Rate their shots</button>' +
      '<button class="btn btn-primary" style="width:100%;margin-top:8px" data-close-sheet="1">Done</button>');
    session = null; sessionGame = null;
    renderSession();
    loadGames().then(loadFinished);
  }

  function saveScore(roundIdx, matchIdx, a, b) {
    var s = session;
    var m = s.rounds[roundIdx].matches[matchIdx];
    if (m.score) { // undo the old score first if re-entered
      m.a.forEach(function (p) { s.points[p] -= m.score[0]; s.played[p]--; });
      m.b.forEach(function (p) { s.points[p] -= m.score[1]; s.played[p]--; });
      s.partners[partnerKey(m.a[0], m.a[1])]--; s.partners[partnerKey(m.b[0], m.b[1])]--;
    }
    m.score = [a, b];
    delete m.skipped;
    m.a.forEach(function (p) { s.points[p] += a; s.played[p]++; });
    m.b.forEach(function (p) { s.points[p] += b; s.played[p]++; });
    s.partners[partnerKey(m.a[0], m.a[1])] = (s.partners[partnerKey(m.a[0], m.a[1])] || 0) + 1;
    s.partners[partnerKey(m.b[0], m.b[1])] = (s.partners[partnerKey(m.b[0], m.b[1])] || 0) + 1;
  }

  function roundDone(r) { return r.matches.every(function (m) { return m.score; }); }

  // Games without a score yet, in any round: [{ ri, mi, m }]
  function openGames(s) {
    var list = [];
    s.rounds.forEach(function (r, ri) { r.matches.forEach(function (m, mi) { if (!m.score && !m.skipped) list.push({ ri: ri, mi: mi, m: m }); }); });
    return list;
  }
  // Players still on court in an unfinished game: they rest in the next round
  function busyOf(s) {
    var busy = {};
    openGames(s).forEach(function (x) { x.m.a.concat(x.m.b).forEach(function (id) { busy[id] = x.ri + 1; }); });
    return busy;
  }
  // Americano, Mexicano and Mixicano can start the next round while a court is still playing.
  // King (needs every result to move courts) and fixed-pair formats (fixed plan) need every court done or skipped.
  function canOverlap(s) { return s.format === 'americano' || s.format === 'mexicano' || s.format === 'mixicano'; }

  function renderSession() {
    var area = $('sessionArea');
    if (!session) { area.innerHTML = ''; $('organizeHome').style.display = ''; return; }
    $('organizeHome').style.display = 'none';
    var s = session;
    var f = FORMATS.filter(function (x) { return x.id === s.format; })[0];
    var last = s.rounds[s.rounds.length - 1];
    var open = openGames(s);
    var anyScore = s.rounds.some(function (r) { return r.matches.some(function (m) { return m.score; }); });
    var allPlanned = s.rounds.length >= s.totalRounds;
    var lastStarted = last.matches.some(function (m) { return m.score; });

    var html = '<div class="session-top"><h3>' + f.icon + ' ' + f.name + '</h3>' +
      '<div style="display:flex;gap:6px"><button class="btn btn-ghost" style="padding:7px 12px;font-size:13px" data-pplayers="1">👥 Players</button>' +
      '<button class="btn btn-ghost" style="padding:7px 12px;font-size:13px" data-end="1">Cancel</button></div></div>' +
      '<p class="meta" style="margin:0 0 10px">' + s.players.length + ' players · ' + s.courts + ' court' + (s.courts > 1 ? 's' : '') + ' · ' + (s.scoring === 'games' ? 'first to ' + s.gamesTarget + ' games · ' + (s.golden ? '⚡ golden point' : '🔁 advantage') : s.target + ' pts per game') + '</p>' +
      '<div class="rounds" id="roundTabs">';
    for (var i = 0; i < s.totalRounds; i++) {
      var exists = i < s.rounds.length;
      html += '<button class="' + (i === s.view ? 'on ' : '') + (exists && roundDone(s.rounds[i]) ? 'done' : '') + '"' +
        (exists ? ' data-view="' + i + '"' : ' disabled style="opacity:.4"') + '>Round ' + (i + 1) + '</button>';
    }
    html += '</div>';

    // every round is a slide: swipe left / right
    html += '<div class="r-track" id="roundTrack">' + s.rounds.map(function (r, ri) {
      var h = '<div class="r-slide">';
      r.matches.forEach(function (m, mi) {
        h += '<div class="card court" data-score="' + ri + ':' + mi + '" role="button">' +
          '<div class="ct"><span>Court ' + (mi + 1) + '</span><span>' + (m.score ? '✅ Done' : ri < s.rounds.length - 1 ? '⏳ Still playing' : '⏳ Playing') + '</span></div>' +
          '<div class="vs"><div class="tm">' + teamName(m.a) + '</div>' +
          '<div class="sc">' + (m.score ? m.score[0] + ' – ' + m.score[1] : 'vs') + '</div>' +
          '<div class="tm">' + teamName(m.b) + '</div></div>' +
          '<div class="tap">' + (m.score ? 'Tap to fix score' : '👆 Tap to keep score') + '<button class="type-btn" data-typescore="' + ri + ':' + mi + '">⌨️ Type score</button></div></div>';
      });
      if (r.busy && r.busy.length) h += '<div class="rest">⏳ Still playing an earlier round: <b>' + r.busy.map(nameOfId).join(', ') + '</b></div>';
      if (r.resting.length) h += '<div class="rest">🪑 Resting this round: <b>' + r.resting.map(nameOfId).join(', ') + '</b></div>';
      return h + '</div>';
    }).join('') + '</div>';
    if (s.rounds.length > 1) {
      html += '<div class="r-dots" id="roundDots">' + s.rounds.map(function (r, ri) { return '<i class="' + (ri === s.view ? 'on' : '') + '"></i>'; }).join('') + '</div>';
    }

    // next round / finish
    if (!allPlanned) {
      if (roundDone(last)) {
        html += '<button class="btn btn-primary big-btn" data-next="1">Next round ➡️</button>';
      } else if (lastStarted && canOverlap(s)) {
        var still = last.matches.filter(function (m) { return !m.score; }).length;
        html += '<button class="btn btn-primary big-btn" data-next="1">Next round ➡️</button>' +
          '<p class="note" style="text-align:center;margin-top:-4px">⏳ ' + still + ' court' + (still > 1 ? 's are' : ' is') + ' still playing. They rest next round, and you can add their score later.</p>';
      } else if (lastStarted) {
        html += '<button class="btn btn-ghost big-btn" data-skipnext="1">⏭️ Skip unfinished games & next round</button>' +
          '<p class="note" style="text-align:center;margin-top:-4px">' + f.name + ' needs every result before the next round. Skipped games give no points.</p>';
      }
    }
    if (allPlanned && !open.length) {
      html += '<button class="btn btn-accent big-btn" data-finish="1">🏁 Finish & give points</button>';
    } else if (anyScore) {
      html += '<button class="btn btn-ghost big-btn" data-finishearly="1">🏁 Finish session now</button>';
    }

    html += '<h2>Live leaderboard</h2>' + standingsHtml(s);
    area.innerHTML = html;

    // show the round you're looking at, and follow swipes
    var track = $('roundTrack');
    track.scrollLeft = s.view * track.clientWidth;
    fitTrack();
    var swipeTimer;
    track.addEventListener('scroll', function () {
      clearTimeout(swipeTimer);
      swipeTimer = setTimeout(function () {
        var v = Math.round(track.scrollLeft / track.clientWidth);
        if (v !== s.view && v >= 0 && v < s.rounds.length) { s.view = v; markRound(); }
      }, 80);
    }, { passive: true });
  }

  function nextRound() {
    var r = makeRound();
    var ok = r && r.matches.length && r.matches.every(function (m) { return m.a.concat(m.b).every(function (id) { return id; }); });
    if (!ok) return toast('⏳ Not enough free players yet. Wait for a court to finish.');
    session.rounds.push(r);
    session.view = session.rounds.length - 1;
    renderSession();
    persistSession();
    window.scrollTo(0, 0);
  }
  var T_ri = 0, T_mi = 0;   // the court the score screen is open for

  // Update the Round tabs and dots after a swipe (no full redraw)
  // the carousel is as tall as the round you're looking at
  function fitTrack() {
    var slide = document.querySelectorAll('#roundTrack .r-slide')[session.view];
    if (slide) $('roundTrack').style.height = slide.offsetHeight ? slide.offsetHeight + 'px' : '';   // 0 = tab hidden: measure later
  }
  function markRound() {
    fitTrack();
    document.querySelectorAll('#roundTabs button').forEach(function (b, i) { b.classList.toggle('on', i === session.view); });
    document.querySelectorAll('#roundDots i').forEach(function (d, i) { d.classList.toggle('on', i === session.view); });
    var tab = document.querySelectorAll('#roundTabs button')[session.view];
    if (tab) tab.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }
  function showRound(i) {
    session.view = i;
    var track = $('roundTrack');
    track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
    markRound();
  }

  // ⌨️ Type a score instead of tapping every point
  function openTypeScore(ri, mi) {
    var s = session, m = s.rounds[ri].matches[mi];
    var games = s.scoring === 'games';
    var G = s.gamesTarget;
    openSheet('<h3>⌨️ Round ' + (ri + 1) + ' · Court ' + (mi + 1) + '</h3>' +
      '<p class="meta" style="margin:-6px 0 12px">' + (games
        ? 'Games won. First to ' + G + ' (' + G + '-' + (G - 2) + ' or less), ' + (G + 1) + '-' + (G - 1) + ', or ' + (G + 1) + '-' + G + ' after a tiebreak.'
        : 'Points won. The two scores add up to ' + s.target + '.') + '</p>' +
      '<form id="typeForm">' +
        '<div class="type-row"><span>' + teamName(m.a) + '</span><input class="input" id="tsA" type="number" inputmode="numeric" min="0" max="99" value="' + (m.score ? m.score[0] : '') + '" required></div>' +
        '<div class="type-row"><span>' + teamName(m.b) + '</span><input class="input" id="tsB" type="number" inputmode="numeric" min="0" max="99" value="' + (m.score ? m.score[1] : '') + '" required></div>' +
        '<div class="error-box" id="tsError" hidden></div>' +
        '<button class="btn btn-primary" style="width:100%;margin-top:12px">✅ Save score</button>' +
      '</form>');
    // points: typing one score fills in the other
    if (!games) {
      $('tsA').addEventListener('input', function () { if (this.value !== '') $('tsB').value = Math.max(0, s.target - this.value); });
      $('tsB').addEventListener('input', function () { if (this.value !== '') $('tsA').value = Math.max(0, s.target - this.value); });
    }
    setTimeout(function () { $('tsA').focus(); }, 250);
    $('typeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var a = parseInt($('tsA').value, 10), b = parseInt($('tsB').value, 10);
      var problem = typedScoreProblem(a, b);
      if (problem) { $('tsError').textContent = problem; $('tsError').hidden = false; return; }
      saveScore(ri, mi, a, b);
      closeSheet(); renderSession(); persistSession();
      toast('✅ Score saved');
    });
  }
  function typedScoreProblem(a, b) {
    var s = session;
    if (isNaN(a) || isNaN(b) || a < 0 || b < 0) return 'Type both scores (0 or more).';
    if (s.scoring !== 'games') return a + b === s.target ? null : 'The scores must add up to ' + s.target + ' (now ' + (a + b) + ').';
    var G = s.gamesTarget, hi = Math.max(a, b), lo = Math.min(a, b);
    if ((hi === G && lo <= G - 2) || (hi === G + 1 && (lo === G - 1 || lo === G))) return null;
    return 'That is not a finished set. Examples: ' + G + '-' + (G - 2) + ', ' + (G + 1) + '-' + (G - 1) + ', ' + (G + 1) + '-' + G + ' (tiebreak).';
  }

  // 🏁 Finish early: show what will be skipped first
  function openFinishEarly() {
    var s = session;
    var open = openGames(s);
    var notStarted = s.totalRounds - s.rounds.length;
    openSheet('<h3>🏁 Finish the session now?</h3>' +
      (open.length ? '<p style="margin:0 0 6px">⚠️ <b>' + open.length + ' game' + (open.length > 1 ? 's were' : ' was') + ' not played:</b></p>' +
        '<div class="card" style="padding:6px 12px;font-size:13px">' + open.map(function (x) {
          return '<div style="padding:4px 0">Round ' + (x.ri + 1) + ' · Court ' + (x.mi + 1) + ': ' + teamName(x.m.a) + ' vs ' + teamName(x.m.b) + '</div>';
        }).join('') + '</div><p class="note" style="margin-top:-4px">They are skipped: nobody gets points for them.</p>' : '') +
      (notStarted > 0 ? '<p style="margin:10px 0 0">📅 ' + (notStarted === 1 ? 'Round ' + s.totalRounds + ' was' : 'Rounds ' + (s.rounds.length + 1) + '–' + s.totalRounds + ' were') + ' not started: dropped.</p>' : '') +
      '<p class="note">The ranking is everyone\'s total points from the games that were played.</p>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">' +
        '<button class="btn btn-ghost" data-close-sheet="1">Go back</button>' +
        '<button class="btn btn-accent" data-finish="1">✅ Finish & give points</button></div>');
  }

  function teamName(ids) { return ids.map(nameOfId).join(' & '); }

  // Leaderboard card, also used by players following a session live
  function standingsHtml(s) {
    var order = s.players.slice().sort(function (a, b) { return s.points[b] - s.points[a]; });
    return '<div class="card">' + order.map(function (p, i) {
      var medal = ['🥇', '🥈', '🥉'][i] || (i + 1);
      var o = s.out && s.out[p];
      return '<div class="lb-row"><span class="pos">' + medal + '</span><span>' + nameOfId(p) + (o ? ' ' + REASONS[o.reason][0] : '') + '</span>' +
        '<small>' + s.played[p] + ' game' + (s.played[p] === 1 ? '' : 's') + (o ? ' · ' + REASONS[o.reason][1].toLowerCase() : '') + '</small><span class="pts">' + s.points[p] + '</span></div>';
    }).join('') + '</div>';
  }

  // =====================================================
  // 4. SCORE TRACKERS (big buttons)
  // =====================================================
  // mode 'sets' = normal padel scoring; mode 'points' = Americano/Mexicano points
  var T = null;
  var undoStack = [];

  function openTracker(opts) {
    T = opts;
    undoStack = [];
    $('doneScreen').classList.remove('open');
    $('tracker').classList.add('open');
    renderTracker();
  }
  function closeTracker() { $('tracker').classList.remove('open'); T = null; }

  // ===== Normal match from a lobby: the host picks a partner from the 4 who joined =====
  var people = [];       // real members
  var me = null;         // my profile
  var pickPartner = null;

  function shortName(p) { return p.display_name || p.username; }
  function personById(id) { return people.filter(function (p) { return p.id === id; })[0]; }

  function newMatch() { openCreate(); }

  function renderTeams() {
    lobbyView = 'teams';
    var g = gameById(lobbyId);
    var others = joinedOf(g).filter(function (id) { return id !== me.id; });
    var opp = others.filter(function (id) { return id !== pickPartner; });
    var chip = function (id) {
      var p = personById(id);
      return '<button class="' + (pickPartner === id ? 'on' : '') + '" data-mpart="' + id + '">' +
        (p && p.gender === 'f' ? '👩 ' : '👨 ') + nameOfId(id) + ' <small>' + PadPal.tierOf(p ? p.points : 0).icon + '</small></button>';
    };
    openSheet(
      '<h3>⚔️ Set teams</h3>' +
      '<div class="label">Your partner</div>' +
      '<div class="pick">' + others.map(chip).join('') + '</div>' +
      (pickPartner
        ? '<div class="card" style="margin-top:14px;text-align:center"><b>' + nameOfId(me.id) + ' & ' + nameOfId(pickPartner) + '</b><div class="meta" style="margin:6px 0">vs</div><b>' + nameOfId(opp[0]) + ' & ' + nameOfId(opp[1]) + '</b></div>'
        : '<p class="note">Tap the friend who plays on your side.</p>') +
      '<button class="btn btn-primary" style="width:100%;margin-top:14px" data-mstart="1"' + (pickPartner ? '' : ' disabled') + '>🎾 Start match</button>' +
      '<button class="btn btn-ghost" style="width:100%;margin-top:8px" data-gopen="' + lobbyId + '">Back to lobby</button>'
    );
  }

  function startMatch(players) {
    var names = players
      ? [shortName(me) + ' & ' + shortName(personById(players.a[1])), shortName(personById(players.b[0])) + ' & ' + shortName(personById(players.b[1]))]
      : ['Team A', 'Team B'];
    var game = players ? lobbyId : null;
    var g = game && gameById(game);
    var matchGolden = !(g && g.settings && g.settings.golden === false);   // golden point unless the host chose advantage
    closeSheet();
    stopLobby();
    openTracker({
      mode: 'sets', title: players ? 'Match · you host' : 'Practice (not saved)', names: names, players: players, game: game,
      golden: matchGolden, pts: [0, 0], games: [0, 0], sets: [], setsWon: [0, 0], tiebreak: false, over: false
    });
  }

  async function saveMatch(btn) {
    btn.disabled = true;
    btn.textContent = 'Saving…';
    var winner = T.setsWon[0] > T.setsWon[1] ? 'a' : 'b';
    var r = await PadPal.db.rpc('save_game_match', {
      p_game: T.game,
      p_a1: T.players.a[0], p_a2: T.players.a[1], p_b1: T.players.b[0], p_b2: T.players.b[1],
      p_sets: T.sets, p_winner: winner
    });
    if (r.error) {
      btn.disabled = false;
      btn.textContent = '💾 Save match';
      toast(PadPal.friendlyError(r.error));
      return;
    }
    T.saved = r.data;
    showDone();
    toast('✅ Match saved and posted to the feed!');
    loadGames().then(loadFinished);
  }

  var LABELS = ['0', '15', '30', '40'];
  function pointLabel(t) {
    var p = T.pts, o = 1 - t;
    if (T.tiebreak) return String(p[t]);
    if (p[0] >= 3 && p[1] >= 3) {
      if (p[t] === p[o]) return '40';
      return p[t] > p[o] ? 'AD' : '40';
    }
    return LABELS[p[t]];
  }

  function winGame(t) {
    var o = 1 - t;
    T.games[t]++;
    T.pts = [0, 0];
    var SG = T.setGames || 6;   // games to win a set (6, or 4 for a short mini-set)
    if (T.tiebreak || (T.games[t] >= SG && T.games[t] - T.games[o] >= 2)) {
      T.sets.push(T.games.slice());
      T.setsWon[t]++;
      T.games = [0, 0];
      T.tiebreak = false;
      if (T.setsWon[t] === (T.setsToWin || 2)) T.over = true;
    } else if (T.games[0] === SG && T.games[1] === SG) {
      T.tiebreak = true;
    }
  }

  function addPoint(t) {
    if (!T || T.over) return;
    undoStack.push(JSON.stringify(T));
    var o = 1 - t;
    if (T.mode === 'points') {
      T.pts[t]++;
      if (T.pts[0] + T.pts[1] >= T.target) T.over = true;
    } else if (T.tiebreak) {
      T.pts[t]++;
      if (T.pts[t] >= 7 && T.pts[t] - T.pts[o] >= 2) winGame(t);
    } else {
      T.pts[t]++;
      var golden = T.golden && T.pts[t] === 4 && T.pts[o] === 3;
      if ((T.pts[t] >= 4 && T.pts[t] - T.pts[o] >= 2) || golden) winGame(t);
    }
    if (navigator.vibrate) navigator.vibrate(15);
    renderTracker();
  }

  function undo() {
    if (!undoStack.length) return;
    T = JSON.parse(undoStack.pop());
    $('doneScreen').classList.remove('open');
    renderTracker();
  }

  function renderTracker() {
    $('tTitle').textContent = T.title;
    for (var t = 0; t < 2; t++) {
      $('nm' + t).textContent = T.names[t];
      if (T.mode === 'points') {
        $('pt' + t).textContent = T.pts[t];
        $('gm' + t).textContent = '';
        $('flag' + t).textContent = '';
      } else {
        $('pt' + t).textContent = pointLabel(t);
        $('gm' + t).textContent = 'Games ' + T.games[t] + '  ·  Sets ' + T.setsWon[t];
        var p = T.pts, o = 1 - t;
        var flag = '';
        if (T.tiebreak) flag = 'TIEBREAK';
        else if (T.golden && p[0] === 3 && p[1] === 3) flag = 'GOLDEN POINT';
        else if ((p[t] >= 3 && p[t] > p[o]) || (p[t] === 3 && p[o] < 3)) flag = T.games[t] >= (T.setGames || 6) - 1 && T.games[t] > T.games[o] ? 'SET POINT' : 'GAME POINT';
        $('flag' + t).textContent = flag;
      }
    }
    $('tType').hidden = !T.inSession;   // sessions: type the score instead
    if (T.mode === 'points') {
      $('tMode').textContent = T.target + ' pts';
      $('tMid').innerHTML = '<span>Points played</span><span class="sets">' + (T.pts[0] + T.pts[1]) + ' / ' + T.target + '</span>';
    } else {
      $('tMode').textContent = T.golden ? '⚡ Golden' : '🔁 Advantage';
      var sets = T.sets.map(function (s) { return s[0] + '-' + s[1]; }).join('  ');
      $('tMid').innerHTML = '<span>Sets</span><span class="sets">' + (sets || '–') + '</span>' +
        (T.golden ? '<span class="gp">· golden point on</span>' : '');
    }
    if (T.over) showDone();
  }

  function showDone() {
    var win = T.mode === 'points' ? (T.pts[0] >= T.pts[1] ? 0 : 1) : (T.setsWon[0] > T.setsWon[1] ? 0 : 1);
    var final = T.mode === 'points'
      ? T.pts[0] + ' – ' + T.pts[1]
      : T.sets.map(function (s) { return s[0] + '-' + s[1]; }).join('  ');
    var buttons;
    if (T.onSave) {
      buttons = '<button class="btn btn-primary" data-save-score="1">✅ Save score</button>' +
        '<button class="btn btn-ghost" data-undo-last="1">↩️ Undo last point</button>';
    } else if (T.saved) {
      // show everyone's new points
      buttons = '<div class="card" style="width:100%;max-width:320px;text-align:left;margin:0">' +
        T.saved.changes.map(function (c) {
          var p = personById(c.user_id);
          var tier = PadPal.tierOf(c.points);
          return '<div class="lb-row"><span>' + (c.won ? '🏆 ' : '') + (p ? shortName(p).replace(/</g, '&lt;') : '?') + '</span>' +
            '<small>' + tier.icon + ' ' + PadPal.fmt(c.points) + '</small>' +
            '<span class="pts ' + (c.change >= 0 ? 'plus' : 'minus') + '">' + PadPal.fmtChange(c.change) + '</span></div>';
        }).join('') + '</div>' +
        '<button class="btn btn-accent" data-rate="' + T.players.a.concat(T.players.b).join(',') + '">🎯 Rate their shots</button>' +
        '<button class="btn btn-primary" data-close-tracker="1">Done</button>';
    } else if (T.players) {
      buttons = '<button class="btn btn-primary" data-save-match="1">💾 Save match</button>' +
        '<button class="btn btn-ghost" data-undo-last="1">↩️ Undo last point</button>';
    } else {
      buttons = '<p class="meta">Practice match: not saved.</p>' +
        '<button class="btn btn-primary" data-close-tracker="1">Done</button>' +
        '<button class="btn btn-ghost" data-undo-last="1">↩️ Undo last point</button>';
    }
    $('doneScreen').innerHTML =
      '<div class="big">🏆</div><h3>' + T.names[win] + ' win!</h3>' +
      '<div class="final">' + final + '</div>' + buttons;
    $('doneScreen').classList.add('open');
  }

  // "Are you sure?" without pop-up dialogs: tap once to warn, tap again within 3s to do it
  var armed = {};
  function tapTwice(key, warning) {
    if (armed[key]) { armed[key] = false; return true; }
    armed[key] = true;
    toast(warning);
    setTimeout(function () { armed[key] = false; }, 3000);
    return false;
  }

  $('tClose').addEventListener('click', function () {
    var started = T && !T.over && (T.pts[0] + T.pts[1] > 0 || (T.games && T.games[0] + T.games[1] > 0));
    if (started && !tapTwice('leave', 'Tap ✕ again to leave. This score will be lost.')) return;
    closeTracker();
  });
  $('tUndo').addEventListener('click', undo);
  $('tMode').addEventListener('click', function () {
    if (T.mode !== 'sets') return;
    T.golden = !T.golden;
    toast(T.golden ? '⚡ Golden point: at 40-40 next point wins' : '🔁 Advantage: must win by 2 at deuce');
    renderTracker();
  });

  // =====================================================
  // CLICKS
  // =====================================================
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-typescore],[data-typeinstead],[data-finishearly],[data-skipnext],[data-invto],[data-invnew],[data-gdone],[data-panel],[data-gcreate],[data-gjoin],[data-gleave],[data-gopen],[data-ginvite],[data-ginvpick],[data-ginvsend],[data-gshare],[data-gremove],[data-gcancel],[data-gteams],[data-gsession],[data-pplayers],[data-pout],[data-pback],[data-padd],[data-preason],[data-psub],[data-pshare],[data-close-sheet],[data-rate],[data-guide],[data-open-guide],[data-setup],[data-view],[data-score],[data-next],[data-finish],[data-end],[data-match],[data-point],[data-save-score],[data-undo-last],[data-mpart],[data-mstart],[data-mfree],[data-save-match],[data-close-tracker],[data-soon]');
    if (!el) return;
    var d = el.dataset;

    if (d.panel) {
      document.querySelectorAll('#seg button').forEach(function (b) { b.classList.toggle('on', b === el); });
      document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('on', p.id === d.panel); });
      if (session && $('roundTrack')) fitTrack();
    }
    // ----- games & lobby -----
    else if (d.gcreate) openCreate();
    else if (d.gjoin) {
      gameAction('join_game', { p_game: d.gjoin, p_code: null }, '🎾 You joined!').then(function (r) { if (r) openLobby(d.gjoin); });
    }
    else if (d.gleave) { closeSheet(); stopLobby(); gameAction('leave_game', { p_game: d.gleave }, 'OK, you\'re out of that game'); }
    else if (d.gopen) openLobby(d.gopen);
    else if (d.ginvite) { invitePick = []; loadFavs().then(renderInvite); }
    else if (d.invto) {
      gameAction('invite_players', { p_game: d.invto, p_users: [d.invwho] }, '📨 Invite sent to ' + nameOfId(d.invwho) + '!').then(function (r) { if (r) closeSheet(); });
    }
    else if (d.invnew) { pendingInvite = d.invnew; openCreate(); }
    else if (d.gdone) openFinished(d.gdone);
    else if (d.ginvpick) {
      var ii = invitePick.indexOf(d.ginvpick);
      if (ii > -1) invitePick.splice(ii, 1); else invitePick.push(d.ginvpick);
      renderInvite();
    }
    else if (d.ginvsend) {
      el.disabled = true;
      gameAction('invite_players', { p_game: lobbyId, p_users: invitePick }, '📨 Invites sent!').then(function () { renderLobby(); });
    }
    else if (d.gshare) shareJoinLink();
    else if (d.gremove) gameAction('remove_player', { p_game: lobbyId, p_user: d.gremove }, 'Removed');
    else if (d.gcancel) {
      if (tapTwice('cancelgame', 'Tap again to cancel this game')) {
        var gid = lobbyId;
        closeSheet(); stopLobby();
        gameAction('cancel_game', { p_game: gid }, 'Game cancelled');
      }
    }
    else if (d.gteams) { pickPartner = null; renderTeams(); }
    else if (d.openGuide) openSheet(guideListHtml());
    else if (d.guide) openSheet(guideHtml(d.guide));
    else if (d.setup) {
      if (session) { closeSheet(); toast('Finish the current session first'); return; }
      openCreate(d.setup);
    }
    else if (d.gsession) startSessionFromLobby(gameById(lobbyId));
    // changing players during a session
    else if (d.pplayers) loadGames().then(openPlayers);   // refresh first: someone may have just joined
    else if (d.pout) openReason(d.pout);
    else if (d.preason) { if (isTeamFormat(session)) openSubstitute(d.preason); else takeOut(changeFor, d.preason, null); }
    else if (d.psub) { var ps = d.psub.split('|'); takeOut(changeFor, ps[1], ps[0]); }
    else if (d.pback) { delete session.out[d.pback]; afterChange('↩️ ' + nameOfId(d.pback) + ' is back in from the next round'); }
    else if (d.padd) { session.players.push(d.padd); session.points[d.padd] = 0; session.played[d.padd] = 0; afterChange('➕ ' + nameOfId(d.padd) + ' plays from the next round'); }
    else if (d.pshare) { lobbyId = sessionGame; shareJoinLink(); lobbyId = null; }
    else if (d.rate) { closeSheet(); PadPal.openRating(d.rate.split(',')); }
    else if (d.closeSheet) closeSheet();
    else if (d.view !== undefined) showRound(+d.view);
    else if (d.typescore) { var tsp = d.typescore.split(':'); openTypeScore(+tsp[0], +tsp[1]); }
    else if (d.typeinstead) { closeTracker(); openTypeScore(T_ri, T_mi); }
    else if (d.finishearly) openFinishEarly();
    else if (d.skipnext) {
      if (!tapTwice('skipnext', 'Tap again: unfinished games are skipped (no points) and the next round starts')) return;
      session.rounds[session.rounds.length - 1].matches.forEach(function (m) { if (!m.score) m.skipped = true; });
      nextRound();
    }
    else if (d.score !== undefined) {
      var sp = d.score.split(':');
      var ri = +sp[0], mi = +sp[1];
      T_ri = ri; T_mi = mi;
      var m = session.rounds[ri].matches[mi];
      var title = 'Round ' + (ri + 1) + ' · Court ' + (mi + 1);
      var names = [teamName(m.a).replace(/&amp;/g, '&'), teamName(m.b).replace(/&amp;/g, '&')];
      var done = function (a, b) {
        saveScore(ri, mi, a, b);
        closeTracker(); renderSession(); persistSession();
        toast('✅ Score saved');
      };
      if (session.scoring === 'games') {
        // tennis scoring: one mini-set to 4 or 6 games, total = games won
        openTracker({
          mode: 'sets', inSession: true, title: title, names: names, setGames: session.gamesTarget, setsToWin: 1, golden: session.golden,
          pts: [0, 0], games: [0, 0], sets: [], setsWon: [0, 0], tiebreak: false, over: false,
          onSave: function () { done(T.sets[0][0], T.sets[0][1]); }
        });
      } else {
        openTracker({
          mode: 'points', inSession: true, title: title, names: names, target: session.target, pts: [0, 0], over: false,
          onSave: function () { done(T.pts[0], T.pts[1]); }
        });
      }
    }
    else if (d.saveScore) T.onSave();
    else if (d.undoLast) undo();
    else if (d.next) nextRound();
    else if (d.finish) finishSession(el);
    else if (d.end) {
      if (tapTwice('end', 'Tap Cancel again: the session is cancelled and nobody gets points.')) {
        var gid = sessionGame;
        session = null; sessionGame = null;
        renderSession();
        gameAction('cancel_game', { p_game: gid }, 'Session cancelled');
      }
    }
    else if (d.match) newMatch();
    else if (d.mpart) { pickPartner = pickPartner === d.mpart ? null : d.mpart; renderTeams(); }
    else if (d.mstart) {
      var others = joinedOf(gameById(lobbyId)).filter(function (id) { return id !== me.id && id !== pickPartner; });
      startMatch({ a: [me.id, pickPartner], b: others });
    }
    else if (d.mfree) startMatch(null);
    else if (d.saveMatch) saveMatch(el);
    else if (d.closeTracker) closeTracker();
    else if (d.point !== undefined) addPoint(+d.point);
    else if (d.soon) {
      e.preventDefault();
      closeSheet();
      toast('🚧 ' + d.soon + ': coming in a later step');
    }
  });

  loadGames().then(joinFromLink).then(inviteFromProfile).then(loadFinished).then(loadTourneys);

  // =====================================================
  // 5. TOURNAMENTS list (details live on tourney.html)
  // =====================================================
  var DIVISIONS = { men: '👨 Men', women: '👩 Women', mixed: '🔀 Mixed', open: '🌍 Open' };

  async function loadTourneys() {
    if (!me) return;
    $('newTourney').hidden = !me.is_admin;
    var r = await db.from('tournaments').select('id, name, kind, division, scheduled_at, place, max_teams, status, tournament_signups(user_id), tournament_teams(id)')
      .neq('status', 'cancelled').order('scheduled_at', { ascending: false }).limit(20);
    if (r.error) {
      $('tourneys').innerHTML = '<p class="meta">' + (/tournament/.test(r.error.message) ? 'Tournaments appear after you run 12_tournaments.sql.' : escH(PadPal.friendlyError(r.error))) + '</p>';
      return;
    }
    var label = { registration: '📝 Sign-ups open', playing: '🔴 Playing now', done: '✅ Finished' };
    $('tourneys').innerHTML = r.data.length ? '<h2>Tournaments</h2>' + r.data.map(function (t) {
      var signed = t.tournament_signups.some(function (s) { return s.user_id === me.id; });
      return '<a class="card game" href="tourney.html?id=' + t.id + '" style="display:block;text-decoration:none;color:var(--text)">' +
        '<div class="when">' + escH(t.name) + '</div>' +
        '<div class="where">' + whenText(t.scheduled_at) + (t.place ? ' · 📍 ' + escH(t.place) : '') + '</div>' +
        '<div class="tags"><span class="tag">' + (t.kind === 'official' ? '🏆 Official' : '🎉 Season 0') + '</span><span class="tag">' + DIVISIONS[t.division] + '</span>' +
        '<span class="tag">' + label[t.status] + '</span>' +
        (t.status === 'registration' ? '<span class="tag">' + t.tournament_signups.length + ' signed up</span>' : '<span class="tag">' + t.tournament_teams.length + ' teams</span>') +
        (signed ? '<span class="tag" style="color:var(--accent)">✅ You\'re in</span>' : '') + '</div></a>';
    }).join('') : '<div class="card" style="text-align:center"><p class="meta" style="margin:6px 0">🏆 No tournaments yet. ' +
      (me.is_admin ? 'Create the first one!' : 'The admin will announce PadPal Cups and friendly Season 0 cups here.') + '</p></div>';
  }

  // Admin: create a tournament
  $('newTourney').addEventListener('click', function () {
    var d = new Date(Date.now() + 7 * 86400000); d.setHours(8, 0, 0, 0);
    var local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    var radio = function (name, v, label, on) { return '<label><input type="radio" name="' + name + '" value="' + v + '"' + (on ? ' checked' : '') + '><span>' + label + '</span></label>'; };
    openSheet('<h3>👑 New tournament</h3><form id="tForm">' +
      '<div class="field"><label for="tName">Name</label><input class="input" id="tName" required maxlength="60" placeholder="PadPal Season 0 Cup"></div>' +
      '<div class="field"><span class="label">Type</span><div class="choices">' + radio('tKind', 'friendly', '🎉 Season 0 (no points)', true) + radio('tKind', 'official', '🏆 Official (500+)') + '</div></div>' +
      '<div class="field"><span class="label">Division</span><div class="choices">' + radio('tDiv', 'open', '🌍 Open', true) + radio('tDiv', 'men', '👨 Men') + radio('tDiv', 'women', '👩 Women') + radio('tDiv', 'mixed', '🔀 Mixed') + '</div></div>' +
      '<div class="field"><span class="label">Max teams</span><div class="choices">' + [4, 6, 8, 12, 16, 24, 32].map(function (n) { return radio('tMax', n, n, n === 8); }).join('') + '</div></div>' +
      '<div class="field"><span class="label">Match length</span><div class="choices">' + radio('tSets', 1, '1 set', true) + radio('tSets', 2, 'Best of 3') + '</div></div>' +
      '<div class="field"><label for="tWhen">When</label><input class="input" id="tWhen" type="datetime-local" value="' + local + '" required></div>' +
      '<div class="field"><label for="tPlace">Where (optional)</label><input class="input" id="tPlace" maxlength="80"></div>' +
      '<p class="note">Everyone who can join gets a 🔔 notification.</p>' +
      '<button class="btn btn-primary" style="width:100%;margin-top:10px" id="tBtn">Create tournament</button></form>');
    $('tForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      $('tBtn').disabled = true;
      var val = function (n) { return document.querySelector('input[name=' + n + ']:checked').value; };
      var r = await db.rpc('create_tournament', {
        p_name: $('tName').value, p_kind: val('tKind'), p_division: val('tDiv'), p_when: new Date($('tWhen').value).toISOString(),
        p_place: $('tPlace').value, p_max_teams: +val('tMax'), p_sets_to_win: +val('tSets')
      });
      if (r.error) { $('tBtn').disabled = false; return toast(PadPal.friendlyError(r.error)); }
      location.href = 'tourney.html?id=' + r.data;
    });
  });

  // play.html#tourney opens the Tourneys tab
  if (location.hash === '#tourney') document.querySelector('[data-panel=tourney]').click();
  renderFormats();

  // refresh the lists when you come back to the app
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') loadGames();
  });
</script>
</body>
</html>
