<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PadPal Play</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="PadPal">
<meta name="theme-color" content="#0B1426">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="levels.js"></script>
<script src="rate.js"></script>
<script src="sessions.js"></script>
<script>PadPal.me = PadPal.guard(); // members only</script>
<style>
  /* ===== Play-only styles ===== */
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin: 4px 0 14px; }
  .seg button { flex: 1; border: 0; background: none; padding: 9px 0; border-radius: 9px; font-size: 14px; color: var(--text-2); font-weight: 600; }
  .seg button.on { background: var(--primary); color: var(--primary-text); }
  .panel { display: none; }
  .panel.on { display: block; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); margin: 18px 0 10px; }
  .big-btn { width: 100%; margin-bottom: 12px; padding: 14px; font-size: 16px; }

  /* Open games */
  .game .when { font-weight: 700; font-size: 16px; }
  .game .where { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .game .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .tag { font-size: 12px; background: var(--card-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
  .slots { display: flex; align-items: center; gap: 6px; }
  .slots .avatar { width: 36px; height: 36px; font-size: 14px; }
  .slots .free { width: 36px; height: 36px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--text-2); font-size: 13px; }
  .slots .need { font-size: 13px; font-weight: 700; color: var(--accent); margin-left: 4px; white-space: nowrap; }
  .slots .btn { margin-left: auto; padding: 9px 14px; font-size: 14px; white-space: nowrap; }
  .slots .joined { background: var(--card-2); color: var(--win); border: 1px solid var(--win); }

  /* Formats */
  .quick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .quick-row button { border: 0; border-radius: 16px; padding: 16px 12px; text-align: left; color: #fff; }
  .quick-row span { font-size: 28px; display: block; margin-bottom: 4px; }
  .quick-row strong { display: block; font-size: 15px; }
  .quick-row small { font-size: 12px; opacity: .85; }
  .formats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .format { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px; text-align: left; }
  .format span { font-size: 22px; }
  .format strong { display: block; font-size: 14px; margin-top: 4px; }
  .format small { color: var(--text-2); font-size: 12px; }

  .guide p, .guide li { font-size: 14px; line-height: 1.5; }
  .guide ol { padding-left: 20px; margin: 8px 0 14px; }
  .guide .ex { background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }

  /* Session setup */
  .label { font-size: 13px; color: var(--text-2); margin: 14px 0 8px; font-weight: 600; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick button { border: 1px solid var(--line); background: var(--card-2); border-radius: 999px; padding: 7px 12px; font-size: 14px; }
  .pick button.on { background: var(--primary); border-color: var(--primary); color: var(--primary-text); font-weight: 600; }
  .note { font-size: 12px; color: var(--text-2); margin-top: 8px; }

  /* Session view */
  .session-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .session-top h3 { margin: 0; font-size: 18px; }
  .rounds { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
  .rounds button { flex-shrink: 0; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--text-2); }
  .rounds button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .rounds button.done::after { content: " ✓"; color: var(--win); }
  .court { width: 100%; text-align: left; display: block; }
  .court .ct { font-size: 12px; color: var(--text-2); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .court .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .court .tm { font-weight: 600; font-size: 14px; }
  .court .tm:last-child { text-align: right; }
  .court .sc { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .court .tap { font-size: 12px; color: var(--accent); margin-top: 8px; text-align: center; }
  .rest { font-size: 13px; color: var(--text-2); margin: 4px 0 12px; }
  .court { cursor: pointer; }
  .court .tap { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .type-btn { border: 1px solid var(--line); background: var(--card-2); color: var(--text); border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 600; }
  /* rounds carousel: swipe left / right */
  .r-track { display: flex; align-items: flex-start; overflow-x: auto; overflow-y: hidden; transition: height .2s; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin: 0 -2px; }
  .r-track::-webkit-scrollbar { display: none; }
  .r-slide { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 0 2px; box-sizing: border-box; }
  .r-dots { display: flex; justify-content: center; gap: 6px; margin: 2px 0 12px; }
  .r-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: all .2s; }
  .r-dots i.on { width: 18px; border-radius: 4px; background: var(--accent); }
  .type-row { display: grid; grid-template-columns: 1fr 90px; gap: 10px; align-items: center; margin-bottom: 10px; font-weight: 600; font-size: 14px; }
  .type-row input { text-align: center; font-size: 22px; font-weight: 800; }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .lb-row:first-child { border-top: 0; }
  .lb-row .pos { width: 24px; text-align: center; font-weight: 800; }
  .lb-row .pts { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
  .lb-row small { color: var(--text-2); }

  /* Tournaments */
  .locked { text-align: center; padding: 22px 16px; }
  .locked .big { font-size: 46px; }
  .locked h3 { margin: 6px 0; }
  .locked p { color: var(--text-2); font-size: 14px; margin: 0 0 12px; }
  .progress { height: 10px; border-radius: 999px; background: var(--card-2); overflow: hidden; margin: 10px 0 6px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); }

  /* ===== Score tracker (full screen, big buttons for on court) ===== */
  .tracker {
    position: fixed; inset: 0; z-index: 60; background: var(--bg);
    display: none; flex-direction: column; max-width: 440px; margin: 0 auto;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select: none; -webkit-user-select: none;
  }
  .tracker.open { display: flex; }
  .t-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .t-bar .title { font-weight: 700; flex: 1; text-align: center; font-size: 14px; }
  .t-bar button { border: 0; background: var(--card); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
  .zone {
    flex: 1; margin: 6px 12px; border-radius: 22px; border: 0; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
    transition: transform .08s;
  }
  .zone:active { transform: scale(.98); }
  .zone.a { background: linear-gradient(160deg, #D6F04A, #9DB816); color: #0F1E3C; }
  .zone.b { background: linear-gradient(160deg, #1F3566, #0F1E3C); border: 2px solid #C9E52C; }
  .zone .nm { font-size: 16px; font-weight: 600; opacity: .9; }
  .zone .pt { font-size: 96px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; margin: 6px 0; }
  .zone .gm { font-size: 14px; opacity: .85; font-variant-numeric: tabular-nums; }
  .zone .flag { position: absolute; top: 12px; right: 14px; font-size: 12px; font-weight: 700; background: rgba(0,0,0,.35); padding: 3px 9px; border-radius: 999px; }
  .t-mid { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 2px 12px; font-size: 13px; color: var(--text-2); }
  .t-mid .sets { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .t-mid .gp { color: var(--accent); font-weight: 700; }
  .t-foot { display: flex; gap: 8px; padding: 8px 12px 12px; }
  .t-foot button { flex: 1; padding: 14px; font-size: 16px; }

  .done-screen { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 10px; }
  .done-screen.open { display: flex; }
  .done-screen .big { font-size: 64px; }
  .done-screen h3 { margin: 0; font-size: 22px; }
  .done-screen .final { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .done-screen .btn { width: 100%; max-width: 320px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><img class="logo-img logo-for-dark" src="logo-dark.svg" alt=""><img class="logo-img logo-for-light" src="logo-light.svg" alt=""><span>Pad</span><b>Pal</b></div>
    <button class="icon-btn" data-open-guide="list" aria-label="Format guide">📖</button>
  </div>
</header>

<main class="wrap">
  <div class="seg" id="seg">
    <button class="on" data-panel="open">📣 Open games</button>
    <button data-panel="organize">🎯 Organize</button>
    <button data-panel="tourney">🏆 Tourneys</button>
  </div>

  <!-- ===== Open games ===== -->
  <section class="panel on" id="open">
    <button class="btn btn-primary big-btn" data-gcreate="1">🎾 Create a match</button>
    <div id="games"><p class="meta">Loading games…</p></div>
    <div id="finished"></div>
  </section>

  <!-- ===== Organize ===== -->
  <section class="panel" id="organize">
    <div id="sessionArea"></div>
    <div id="organizeHome">
      <h2>Quick start</h2>
      <div class="quick-row">
        <button style="background:linear-gradient(150deg,#1F3566,#0F1E3C);border:1px solid #27395E" data-match="1"><span>🎾</span><strong>Normal match</strong><small>Sets · 15-30-40</small></button>
        <button style="background:linear-gradient(150deg,#D6F04A,#9DB816);color:#0F1E3C" data-setup="americano"><span>🔄</span><strong>Americano</strong><small>Rotate partners</small></button>
      </div>
      <h2>All formats <span style="text-transform:none;letter-spacing:0;font-weight:500">· tap for how it works</span></h2>
      <div class="formats" id="formats"></div>
    </div>
  </section>

  <!-- ===== Tournaments ===== -->
  <section class="panel" id="tourney">
    <div class="card locked">
      <div class="big">🔒</div>
      <h3>Official PadPal Tournaments</h3>
      <p>Reach <b>500 points</b> (max Junior) to unlock. Only way to become 🥈 Pro and beyond!</p>
      <div class="progress"><i id="tBar" style="width:0%"></i></div>
      <div class="meta" id="tPts">You: … / 500 points</div>
    </div>
    <button class="btn btn-primary big-btn" id="newTourney" hidden>👑 Create tournament</button>
    <div id="tourneys"><p class="meta">Loading tournaments…</p></div>
  </section>
</main>

<!-- Bottom tab bar -->
<nav class="tabbar">
  <div class="tabs">
    <a href="feed.html"><span>🏠</span>Feed</a>
    <a class="on" href="play.html"><span>🎾</span>Play</a>
    <a href="chat.html"><span>💬</span>Chat</a>
    <a href="ranks.html"><span>🏆</span>Ranks</a>
    <a href="profile.html"><span>👤</span>Me</a>
  </div>
</nav>

<!-- Pop-up sheet (format guides + session setup) -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<!-- Full-screen score tracker -->
<div class="tracker" id="tracker">
  <div class="t-bar">
    <button id="tClose">✕</button>
    <div class="title" id="tTitle">Normal match</div>
    <button id="tType" data-typeinstead="1" hidden>⌨️ Type</button>
    <button id="tMode"></button>
  </div>
  <button class="zone a" data-point="0">
    <span class="flag" id="flag0"></span>
    <div class="nm" id="nm0"></div><div class="pt" id="pt0">0</div><div class="gm" id="gm0"></div>
  </button>
  <div class="t-mid" id="tMid"></div>
  <button class="zone b" data-point="1">
    <span class="flag" id="flag1"></span>
    <div class="nm" id="nm1"></div><div class="pt" id="pt1">0</div><div class="gm" id="gm1"></div>
  </button>
  <div class="t-foot">
    <button class="btn btn-ghost" id="tUndo">↩️ Undo</button>
  </div>
  <div class="done-screen" id="doneScreen"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ===== Helpers =====
  function $(id) { return document.getElementById(id); }
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function openSheet(html) {
    $('sheetBody').innerHTML = html;
    $('sheet').scrollTop = 0;
    $('sheet').classList.add('open');
    $('backdrop').classList.add('open');
  }
  function closeSheet() {
    $('sheet').classList.remove('open');
    $('backdrop').classList.remove('open');
  }
  $('backdrop').addEventListener('click', closeSheet);

  // =====================================================
  // 1. GAMES: invites, your games, open games, lobby (all real)
  // =====================================================
  var db = PadPal.db;
  var games = [];        // open games I can see, with their players
  var lobbyId = null;    // the lobby that's open right now
  var lobbyTimer = null;
  var lobbyView = 'lobby'; // which lobby screen is showing: lobby, invite or teams

  function escH(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nameOfId(id) { var p = personById(id); return p ? escH(shortName(p)) : 'Someone'; }
  function whenText(iso) {
    var d = new Date(iso), now = new Date();
    var day = d.toDateString() === now.toDateString() ? 'Today'
      : d.toDateString() === new Date(now.getTime() + 86400000).toDateString() ? 'Tomorrow'
      : d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    return day + ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function joinedOf(g) { return g.game_players.filter(function (p) { return p.status === 'joined'; }).map(function (p) { return p.user_id; }); }
  function myStatus(g) { var p = g.game_players.filter(function (x) { return x.user_id === me.id; })[0]; return p ? p.status : null; }
  function gameById(id) { return games.filter(function (g) { return g.id === id; })[0]; }

  async function loadGames() {
    try {
      var who = await PadPal.me;
      if (!who) return;
      me = who.profile;
      // your real points on the Tourneys tab
      var pts = Number(me.points) || 0;
      $('tBar').style.width = Math.max(2, Math.min(100, pts / 500 * 100)) + '%';
      $('tPts').textContent = 'You: ' + PadPal.fmt(pts) + ' / 500 points';
      people = await PadPal.members();
      var r = await db.from('games')
        .select('id, host_id, kind, scheduled_at, place, size, is_open, status, join_code, settings, session_state, game_players(user_id, status)')
        .eq('status', 'open').order('scheduled_at').limit(50);
      if (r.error) throw r.error;
      games = r.data;
    } catch (err) {
      $('games').innerHTML = '<div class="error-box">' + escH(PadPal.friendlyError(err)) + '</div>';
      return;
    }
    renderGames();
    if (lobbyId && lobbyView === 'lobby') renderLobby();
  }

  function kindLabel(g) {
    var names = { americano: '🔄 Americano', mexicano: '🌮 Mexicano', mixicano: '🔀 Mixicano', team_americano: '🤝 Team Americano', round_robin: '⭕ Round Robin', king: '👑 King of the Court' };
    return names[g.kind] ? names[g.kind] + ' · up to ' + g.size : '🎾 Match · 2 vs 2';
  }

  function gameCard(g, buttons) {
    var joined = joinedOf(g);
    var free = g.size - joined.length;
    var faces = joined.slice(0, 4).map(function (id) { return '<div class="avatar">' + nameOfId(id)[0] + '</div>'; }).join('');
    var empties = '';
    for (var k = 0; k < Math.min(free, 2); k++) empties += '<div class="free">+</div>';
    return '<article class="card game">' +
      '<div class="when">' + whenText(g.scheduled_at) + '</div>' +
      '<div class="where">' + (g.place ? '📍 ' + escH(g.place) + ' · ' : '') + 'host: ' + nameOfId(g.host_id) + '</div>' +
      '<div class="tags"><span class="tag">' + kindLabel(g) + '</span>' + (g.is_open ? '<span class="tag">📣 Open</span>' : '<span class="tag">🔒 Invite only</span>') +
        (g.session_state ? '<span class="tag">🔴 Playing now</span>' : '') + '</div>' +
      '<div class="slots">' + faces + empties +
        (free > 0 ? '<span class="need">Need ' + free + '</span>' : '<span class="need" style="color:var(--win)">Full ✓</span>') +
        buttons + '</div></article>';
  }

  function renderGames() {
    var invites = games.filter(function (g) { return myStatus(g) === 'invited'; });
    var mine = games.filter(function (g) { return myStatus(g) === 'joined'; });
    var open = games.filter(function (g) {
      return g.is_open && myStatus(g) !== 'joined' && myStatus(g) !== 'invited' && joinedOf(g).length < g.size;
    });
    var html = '';
    if (invites.length) {
      html += '<h2>🎟️ Invites for you</h2>' + invites.map(function (g) {
        return gameCard(g, '<button class="btn btn-ghost" data-gleave="' + g.id + '">No</button><button class="btn btn-primary" data-gjoin="' + g.id + '">Join</button>');
      }).join('');
    }
    html += '<h2>🎾 Your games</h2>' + (mine.length ? mine.map(function (g) {
      return gameCard(g, '<button class="btn btn-primary" data-gopen="' + g.id + '">' + (g.host_id === me.id ? 'Open lobby' : 'View') + '</button>');
    }).join('') : '<p class="meta">No games yet. Create one, or join an open game below!</p>');
    html += '<h2>📣 Open games</h2>' + (open.length ? open.map(function (g) {
      return gameCard(g, '<button class="btn btn-primary" data-gjoin="' + g.id + '">Join</button>');
    }).join('') : '<p class="meta">No open games right now.</p>');
    $('games').innerHTML = html;
  }

  // ----- Create a game -----
  function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }

  // "8 rounds on 3 courts · everyone plays about 6 games"
  function sessionEstimate(g, n) {
    var st = g.settings || {};
    var courts = Math.max(1, Math.min(st.courts || 2, Math.floor(n / 4)));
    var rounds = st.rounds || (g.kind === 'king' ? 6 : Math.min(7, Math.max(3, n - 1)));
    var each = Math.round(rounds * courts * 4 / n);
    return '🎾 ' + rounds + ' rounds on ' + courts + ' court' + (courts > 1 ? 's' : '') + ' · everyone plays about <b>' + each + '</b> game' + (each === 1 ? '' : 's') + '.';
  }

  function openCreate(kind) {
    kind = kind || 'match';
    var d = new Date(Date.now() + 3600000);
    d.setMinutes(0, 0, 0);
    var local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    var radio = function (k, label) { return '<label><input type="radio" name="cKind" value="' + k + '"' + (k === kind ? ' checked' : '') + '><span>' + label + '</span></label>'; };
    openSheet(
      '<h3>🎾 New game</h3>' +
      '<form id="createForm">' +
        '<div class="field"><span class="label">What do you want to play?</span><div class="choices">' +
          radio('match', '🎾 Match (4)') + radio('americano', '🔄 Americano') + radio('mexicano', '🌮 Mexicano') + radio('mixicano', '🔀 Mixicano') + radio('team_americano', '🤝 Team Americano') + radio('round_robin', '⭕ Round Robin') + radio('king', '👑 King of the Court') +
        '</div></div>' +
        '<div id="cSession"' + (kind === 'match' ? ' hidden' : '') + '>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">' +
            '<div class="field"><label for="cSize">Max players</label><select class="input" id="cSize">' +
              range(5, 64).map(function (n) { return '<option' + (n === 8 ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>' +
            '<div class="field"><label for="cCourts">Courts</label><select class="input" id="cCourts">' +
              range(1, 12).map(function (n) { return '<option' + (n === 2 ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>' +
            '<div class="field"><label for="cRounds">Rounds</label><select class="input" id="cRounds"><option value="0">Auto</option>' +
              range(3, 15).map(function (n) { return '<option>' + n + '</option>'; }).join('') + '</select></div>' +
          '</div>' +
          '<div class="field"><span class="label">Scoring</span><div class="choices">' +
            '<label><input type="radio" name="cScoring" value="points" checked><span>🔢 Points</span></label>' +
            '<label><input type="radio" name="cScoring" value="games"><span>🎾 Tennis (15-30-40)</span></label>' +

        '<div class="field"><label for="cWhen">When</label><input class="input" id="cWhen" type="datetime-local" value="' + local + '" required></div>' +

          '<label><input type="radio" name="cOpen" value="yes"><span>📣 Any member</span></label>' +

      '</form>' +
      '<button class="btn btn-ghost" style="width:100%;margin-top:8px" data-mfree="1">Just keep score now (not saved)</button>'
    );
    // show only the options that matter for what you picked
    function refresh() {
      var k = document.querySelector('input[name=cKind]:checked').value;
      var games = document.querySelector('input[name=cScoring]:checked').value === 'games';
      $('cSession').hidden = k === 'match';
      $('cPointsBox').hidden = games;
      $('cGamesBox').hidden = !games;
      $('cDeuceBox').hidden = k !== 'match' && !games;
    }
    document.querySelectorAll('input[name=cKind], input[name=cScoring]').forEach(function (r) { r.addEventListener('change', refresh); });
    $('createForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      $('cBtn').disabled = true;
      var k = document.querySelector('input[name=cKind]:checked').value;
      var r = await db.rpc('create_game', {
        p_kind: k,
        p_when: new Date($('cWhen').value).toISOString(),
        p_place: $('cPlace').value,
        p_open: document.querySelector('input[name=cOpen]:checked').value === 'yes',
        p_size: k === 'match' ? 4 : +$('cSize').value,
        p_settings: k === 'match'
          ? { golden: document.querySelector('input[name=cDeuce]:checked').value === 'golden' }
          : {
              scoring: document.querySelector('input[name=cScoring]:checked').value,
              target: +document.querySelector('input[name=cTarget]:checked').value,
              games: +document.querySelector('input[name=cGames]:checked').value,
              golden: document.querySelector('input[name=cDeuce]:checked').value === 'golden',
              courts: +$('cCourts').value,
              rounds: +$('cRounds').value
            }
      });
      if (r.error) { $('cBtn').disabled = false; return toast(PadPal.friendlyError(r.error)); }
      if (pendingInvite) {   // came from "🎾 Invite" on someone's profile
        await db.rpc('invite_players', { p_game: r.data.id, p_users: [pendingInvite] });
        toast('📨 ' + nameOfId(pendingInvite) + ' is invited');
        pendingInvite = null;
      }
      await loadGames();
      openLobby(r.data.id);
    });
  }

  // ----- The lobby -----
  function openLobby(id) {
    lobbyId = id;
    renderLobby();
    clearInterval(lobbyTimer);
    lobbyTimer = setInterval(function () { if (lobbyId && $('sheet').classList.contains('open')) loadGames(); else stopLobby(); }, 6000);
  }
  function stopLobby() { lobbyId = null; clearInterval(lobbyTimer); }

  function renderLobby() {
    lobbyView = 'lobby';
    var g = gameById(lobbyId);
    if (!g) { closeSheet(); stopLobby(); toast('This game is finished or cancelled'); return; }
    var host = g.host_id === me.id;
    var joined = joinedOf(g);
    var row = function (p) {
      var icon = p.status === 'joined' ? '✅' : p.status === 'invited' ? '⏳' : '❌';
      var label = p.status === 'joined' ? 'joined' : p.status === 'invited' ? 'invited' : 'said no';
      return '<div class="lb-row"><span>' + icon + ' ' + nameOfId(p.user_id) + (p.user_id === g.host_id ? ' 👑' : '') + '</span><small>' + label + '</small>' +
        (host && p.user_id !== me.id && p.status !== 'declined' ? '<button class="btn btn-ghost" style="margin-left:auto;padding:4px 10px;font-size:12px" data-gremove="' + p.user_id + '">Remove</button>' : '') +
        '</div>';
    };
    var order = { joined: 0, invited: 1, declined: 2 };
    var list = g.game_players.slice().sort(function (a, b) { return order[a.status] - order[b.status]; });
    var isSession = g.kind !== 'match';
    var html = '<h3>' + (isSession ? kindLabel(g).split(' · ')[0] + ' lobby' : '🎾 Match lobby') + '</h3>' +
      '<p class="meta" style="margin:-6px 0 12px">' + whenText(g.scheduled_at) + (g.place ? ' · 📍 ' + escH(g.place) : '') + '</p>' +
      '<div class="label">Players (' + joined.length + ' / ' + g.size + ' joined)</div>' +
      '<div class="card" style="padding:4px 12px">' + list.map(row).join('') + '</div>';
    if (isSession && g.session_state) {
      // already playing: show the live leaderboard
      html += '<div class="label">🔴 Live leaderboard</div>' + standingsHtml(g.session_state);
    }
    if (host) {
      var startBtn;
      if (!isSession) {
        startBtn = joined.length === 4
          ? '<button class="btn btn-primary" style="width:100%;margin-top:10px" data-gteams="1">⚔️ Set teams & start</button>'
          : '<p class="note">Waiting for ' + (4 - joined.length) + ' more player' + (4 - joined.length > 1 ? 's' : '') + ' to join… (updates by itself)</p>';
      } else if (g.session_state) {
        startBtn = '<button class="btn btn-primary" style="width:100%;margin-top:10px" data-gsession="1">▶️ Continue session</button>';
      } else {
        startBtn = joined.length >= 5
          ? '<button class="btn btn-primary" style="width:100%;margin-top:10px" data-gsession="1">🚀 Start session with ' + joined.length + ' players</button>' +
            '<p class="note">' + sessionEstimate(g, joined.length) + ' Late players can still join with the link: add them with 👥 Players.</p>'
          : '<p class="note">A session needs at least 5 players. Waiting for ' + (5 - joined.length) + ' more… (updates by itself)</p>';
      }
      html += (g.session_state ? '' : '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">' +
        '<button class="btn btn-ghost" data-ginvite="1">👥 Invite friends</button>' +
        '<button class="btn btn-ghost" data-gshare="1">🔗 Share join link</button></div>') +
        startBtn +
        '<button class="btn btn-ghost" style="width:100%;margin-top:8px" data-gcancel="1">Cancel game</button>';
    } else {
      html += '<p class="note">' + (isSession
          ? (g.session_state && g.session_state.players.indexOf(me.id) < 0 && myStatus(g) === 'joined'
              ? '⏳ You joined after the start. The host will add you to the next round.'
              : 'The host keeps the scores. This leaderboard updates by itself. Only the final place gives points. 🏆')
          : 'The host sets the teams and saves the score. Your points update automatically. 🎾') + '</p>' +
        (myStatus(g) === 'joined' && !g.session_state ? '<button class="btn btn-ghost" style="width:100%;margin-top:10px" data-gleave="' + g.id + '">Leave game</button>' : '');
    }
    openSheet(html);
  }

  // Invite picker
  var invitePick = [];
  function renderInvite() {
    lobbyView = 'invite';
    var g = gameById(lobbyId);
    var inGame = g.game_players.filter(function (p) { return p.status !== 'declined'; }).map(function (p) { return p.user_id; });
    // ⭐ favourites first
    var others = people.filter(function (p) { return inGame.indexOf(p.id) < 0; })
      .sort(function (a, b) { return (favs[b.id] ? 1 : 0) - (favs[a.id] ? 1 : 0); });

      (Object.keys(favs).length ? '' : '<p class="meta" style="margin:-6px 0 10px">Tip: tap ☆ on someone\'s profile to put them first here.</p>') +
      (others.length ? '<div class="pick">' + others.map(function (p) {
        return '<button class="' + (invitePick.indexOf(p.id) > -1 ? 'on' : '') + '" data-ginvpick="' + p.id + '">' + (favs[p.id] ? '⭐ ' : '') + (p.gender === 'f' ? '👩 ' : '👨 ') + escH(shortName(p)) + ' <small>' + PadPal.tierOf(p.points).icon + '</small></button>';
      }).join('') + '</div>' : '<p class="meta">Everyone is already invited. Share the join link, or invite new friends to PadPal from your profile.</p>') +
      '<button class="btn btn-primary" style="width:100%;margin-top:14px" data-ginvsend="1"' + (invitePick.length ? '' : ' disabled') + '>Send ' + (invitePick.length || '') + ' invite' + (invitePick.length === 1 ? '' : 's') + '</button>' +
      '<button class="btn btn-ghost" style="width:100%;margin-top:8px" data-gopen="' + lobbyId + '">Back to lobby</button>');

  async function shareJoinLink() {
    var g = gameById(lobbyId);
    var link = new URL('play.html?join=' + g.join_code, location.href).href;
    var what = g.kind === 'match' ? 'padel match' : kindLabel(g).split(' · ')[0];
    var text = 'Join my ' + what + ' on PadPal 🎾 ' + whenText(g.scheduled_at) + (g.place ? ' · ' + g.place : '');
    if (navigator.share) {
      try { await navigator.share({ title: 'PadPal match', text: text, url: link }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(link); toast('📋 Join link copied!'); }
    catch (e) { toast('Join link: ' + link); }
  }

  async function gameAction(fn, args, okMsg) {
    var r = await db.rpc(fn, args);
    if (r.error) { toast(PadPal.friendlyError(r.error)); return null; }
    if (okMsg) toast(okMsg);
    await loadGames();
    return r;
  }

  // Opened from someone's profile: play.html?invite=<member id>
  async function inviteFromProfile() {
    var id = new URLSearchParams(location.search).get('invite');
    if (!id) return;
    history.replaceState(null, '', 'play.html');
    var p = personById(id);

    // your games that haven't started and where they aren't in yet

          '<b>' + kindLabel(g) + '</b><div class="meta">' + whenText(g.scheduled_at) + (g.place ? ' · 📍 ' + escH(g.place) : '') + ' · ' + joinedOf(g).length + '/' + g.size + ' joined</div></button>';
      }).join('') : '<p class="meta">You have no open games yet.</p>') +

  // Your finished games (newest first): tap to see the result again
  var finishedGames = [];
  async function loadFinished() {
    var mine = await db.from('game_players').select('game_id').eq('user_id', me.id).eq('status', 'joined');
    var ids = (mine.data || []).map(function (x) { return x.game_id; });
    if (!ids.length) { $('finished').innerHTML = ''; return; }
    var r = await db.from('games').select('id, host_id, kind, scheduled_at, place, session_state').in('id', ids.slice(-300))
      .eq('status', 'done').order('scheduled_at', { ascending: false }).limit(10);
    finishedGames = r.data || [];
    $('finished').innerHTML = finishedGames.length ? '<h2>✅ Finished</h2>' + finishedGames.map(function (g) {
      var label = PadPal.sessions.KINDS[g.kind] || '🎾 Match';
      var res = '';
      if (g.session_state && g.session_state.players) {
        var row = PadPal.sessions.rows(g.session_state).filter(function (x) { return x.id === me.id; })[0];
        if (row) res = (row.place <= 3 ? PadPal.sessions.medal(row.place) + ' ' : '') + PadPal.sessions.ordinal(row.place) + ' of ' + g.session_state.players.length;
      }
      return '<button class="card" style="width:100%;text-align:left;margin-bottom:8px;color:var(--text);display:flex;align-items:center;gap:10px" data-gdone="' + g.id + '">' +
        '<div style="flex:1;min-width:0"><b>' + label + '</b>' + (g.host_id === me.id ? ' <small class="meta">👑 you hosted</small>' : '') +
        '<div class="meta">' + whenText(g.scheduled_at) + (g.place ? ' · 📍 ' + escH(g.place) : '') + '</div></div>' +
        '<span style="font-weight:700;white-space:nowrap">' + res + '</span><span class="meta">›</span></button>';
    }).join('') : '';
  }
  async function openFinished(id) {
    var g = finishedGames.filter(function (x) { return x.id === id; })[0];
    if (!g) return;
    if (g.kind === 'match') {
      var m = await db.from('matches').select('a1, a2, b1, b2, sets, winner').eq('game_id', id).maybeSingle();
      if (!m.data) return toast('This match was undone');
      var x = m.data;
      var team = function (t) { return nameOfId(x[t + '1']) + ' & ' + nameOfId(x[t + '2']); };
      return openSheet('<h3>🎾 Match</h3><p class="meta" style="margin:-6px 0 12px">' + whenText(g.scheduled_at) + (g.place ? ' · 📍 ' + escH(g.place) : '') + '</p>' +
        '<div class="card"><div class="lb-row"><span>' + (x.winner === 'a' ? '🏆 ' : '') + team('a') + '</span><span class="pts">' + x.sets.map(function (s) { return s[0]; }).join(' ') + '</span></div>' +
        '<div class="lb-row"><span>' + (x.winner === 'b' ? '🏆 ' : '') + team('b') + '</span><span class="pts">' + x.sets.map(function (s) { return s[1]; }).join(' ') + '</span></div></div>');
    }
    var r = await db.from('point_changes').select('user_id, change').eq('game_id', id).eq('reason', 'session');
    var ch = {};
    (r.data || []).forEach(function (c) { ch[c.user_id] = c.change; });
    openSheet(PadPal.sessions.detail(g, ch, nameOfId, avatarOfId, me.id));
  }
  function avatarOfId(id) { return nameOfId(id)[0]; }

  // Opened from a join link: play.html?join=CODE
  async function joinFromLink() {
    var code = new URLSearchParams(location.search).get('join');
    if (!code) return;
    history.replaceState(null, '', 'play.html');
    await PadPal.me;

    if (r.error) return toast(PadPal.friendlyError(r.error));
